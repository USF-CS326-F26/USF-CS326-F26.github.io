<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}} - CS 326</title>

    <!-- Reveal.js CSS -->
    <link rel="stylesheet" href="https://unpkg.com/reveal.js@5.0.4/dist/reveal.css">
    <link rel="stylesheet" href="https://unpkg.com/reveal.js@5.0.4/dist/theme/white.css">

    <!-- Highlight.js for syntax highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/a11y-light.min.css">

    <style>
        :root {
            --primary-color: #00543c;
            --accent-color: #FDBB30;
            --bg-color: #ffffff;
        }

        .reveal {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            font-size: 28px;
        }

        .reveal h1, .reveal h2, .reveal h3, .reveal h4 {
            color: var(--primary-color);
            text-transform: none;
        }

        .reveal h1 {
            font-size: 2.2em;
        }

        .reveal h2 {
            font-size: 1.6em;
        }

        .reveal a {
            color: var(--primary-color);
        }

        .reveal a:hover {
            color: var(--accent-color);
        }

        .reveal .slides section {
            text-align: left;
        }

        .reveal pre {
            width: 100%;
            font-size: 0.5em;
        }

        .reveal code {
            background: #f5f5f5;
            padding: 0.1em 0.3em;
            border-radius: 3px;
        }

        .reveal pre code {
            background: none;
            padding: 1em;
            color: #333;
        }

        .reveal table {
            margin: 0 auto;
            font-size: 0.65em;
        }

        .reveal table th {
            background: var(--primary-color);
            color: white;
            padding: 0.4em 0.8em;
        }

        .reveal table th code {
            background: rgba(255, 255, 255, 0.2);
            color: inherit;
        }

        .reveal table td {
            padding: 0.3em 0.8em;
            border-bottom: 1px solid #ddd;
        }

        .reveal .slide-number {
            color: var(--primary-color);
            font-size: 0.8em;
            left: 15px;
            right: auto;
        }

        .back-link {
            position: fixed;
            top: 15px;
            left: 15px;
            font-size: 0.7em;
            z-index: 100;
        }

        .back-link a {
            color: var(--primary-color);
            text-decoration: none;
            padding: 0.3em 0.6em;
            background: #f5f5f5;
            border-radius: 4px;
        }

        .back-link a:hover {
            background: var(--accent-color);
            color: var(--primary-color);
        }

        .highlight-box {
            background: #fff3cd;
            border-left: 4px solid var(--accent-color);
            padding: 0.5em 1em;
            margin: 0.5em 0;
        }

        .info-box {
            background: #e8f5e9;
            border-left: 4px solid var(--primary-color);
            padding: 0.5em 1em;
            margin: 0.5em 0;
        }

        .mermaid {
            text-align: center;
        }

        .reveal .mermaid svg {
            max-height: 560px;
            max-width: 100%;
            height: auto;
        }

        ul, ol {
            display: block;
        }

        li {
            margin-bottom: 0.3em;
        }

        .two-column {
            display: flex;
            gap: 2em;
        }

        .two-column > div {
            flex: 1;
        }

        .tree-diagram {
            font-family: monospace;
            background: #f5f5f5;
            padding: 1em;
            border-radius: 4px;
            text-align: center;
            font-size: 0.9em;
        }

        /* ---- Weekly-deck additions (see CONTRIBUTING.md, "Slide decks") ---- */

        /* Going deeper: lives only in a vertical (down-arrow) stack under its
           core slide. Right arrow / clicker skips it; down arrow dives in. */
        .reveal .slides section.deeper::before {
            content: "Going deeper \00B7  optional";
            position: absolute;
            top: -1.6em;
            right: 0;
            font-size: 0.45em;
            font-weight: 700;
            color: #555;
            background: #eee;
            padding: 0.15em 0.7em;
            border-radius: 4px;
        }


        /* Make the down arrow obvious when a stack has depth below it. */
        .reveal .controls .navigate-down.enabled {
            color: var(--accent-color);
        }

        .reveal .small {
            font-size: 0.75em;
        }
    </style>
</head>
<body>
    <div class="back-link">
        <a href="{{PAGE_STEM}}/">&larr; {{WEEK_LABEL}} page</a>
    </div>

    <div class="reveal">
        <div class="slides">
            <!-- One markdown section. Horizontal slides: a line of three dashes.
                 Vertical "Going deeper" slides: a blank line, two dashes, a blank line.
                 Speaker notes: a line starting "Notes:" (public: the no-leak rule applies). -->
            <section data-markdown
                     data-separator-vertical="^\r?\n--\r?\n$"
                     data-separator-notes="^\s*Notes?:">
                <textarea data-template>
{{MARKDOWN}}
                </textarea>
            </section>
        </div>
    </div>


    <!-- Reveal.js -->
    <script src="https://unpkg.com/reveal.js@5.0.4/dist/reveal.js"></script>
    <script src="https://unpkg.com/reveal.js@5.0.4/plugin/markdown/markdown.js"></script>
    <script src="https://unpkg.com/reveal.js@5.0.4/plugin/highlight/highlight.js"></script>
    <script src="https://unpkg.com/reveal.js@5.0.4/plugin/notes/notes.js"></script>

    <!-- Mermaid.js -->
    <script src="https://unpkg.com/mermaid@11/dist/mermaid.min.js"></script>

    <script>
        // Initialize Mermaid
        mermaid.initialize({
            startOnLoad: false,
            theme: 'base',
            themeVariables: {
                primaryColor: '#e8f5e9',
                primaryBorderColor: '#00543c',
                primaryTextColor: '#00543c',
                lineColor: '#00543c',
                secondaryColor: '#fff3cd',
                tertiaryColor: '#ffffff'
            }
        });

        // Initialize Reveal.js
        // Press S for the speaker view (notes, timer, next slide).
        // PageDown/PageUp (what most clickers send) move horizontally, so a
        // clicker walks the core slides and skips every "Going deeper" stack.
        Reveal.initialize({
            hash: true,
            slideNumber: 'c/t',
            fragments: false,   // every slide shows all of its content at once
            plugins: [ RevealMarkdown, RevealHighlight, RevealNotes ],
            keyboard: { 33: 'left', 34: 'right' },
            markdown: {
                smartypants: false
            }
        }).then(() => {
            renderMermaidDiagrams();
        });

        // Re-render Mermaid on slide change
        Reveal.on('slidechanged', () => {
            renderMermaidDiagrams();
        });

        // Robust mermaid rendering — read decoded textContent (undo any HTML-entity
        // escaping from the markdown pipeline) and wait for web fonts so text
        // measurement does not yield NaN geometry.
        async function renderMermaidDiagrams() {
            if (document.fonts && document.fonts.ready) {
                try { await document.fonts.ready; } catch (e) {}
            }
            var nodes = document.querySelectorAll('.mermaid');
            for (var i = 0; i < nodes.length; i++) {
                var el = nodes[i];
                if (el.getAttribute('data-mmd-done')) { continue; }
                try {
                    var out = await mermaid.render('mmd-' + (window.__mmdId = (window.__mmdId || 0) + 1), el.textContent);
                    el.innerHTML = out.svg;
                    el.setAttribute('data-mmd-done', '1');
                } catch (e) { if (window.console) { console.error('mermaid render failed', e); } }
            }
        }
    </script>
</body>
</html>

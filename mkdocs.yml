# ==============================================================================
# CS 326 Operating Systems — Fall 2026
# ==============================================================================

site_name: CS 326 Operating Systems Fall 2026
site_description: USFCS Undergraduate Operating Systems — build a RISC-V kernel in Rust
site_author: Greg Benson
site_url: http://cs326-f26.cs.usfca.edu

repo_url: https://github.com/USF-CS326-F26/USF-CS326-F26.github.io
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  logo: assets/images/usfcs_logo.png
  favicon: assets/images/usfcs_logo.png

  palette:
    # Light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  features:
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - macros:
      include_yaml:
        - docs/schedule.yml
      verbose: false
      on_undefined: silent

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        # NOTE the custom class. Material's built-in mermaid handler targets
        # ".mermaid" and would render these too early — before web fonts are
        # ready — which yields NaN geometry and blank diagrams. Using a
        # different class keeps it away, and docs/javascripts/mermaid-init.js
        # renders them after `document.fonts.ready`.
        - name: mermaid
          class: mermaid-diagram
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true

# ==============================================================================
# External links — these appear in the secondary header bar
# ==============================================================================
extra:
  external_links:
    - name: Campuswire
      url: https://campuswire.com/
      icon: fontawesome/solid/comments
    - name: Canvas
      url: https://usfca.instructure.com/
      icon: fontawesome/solid/graduation-cap
    - name: Syllabus
      url: /syllabus/
      icon: fontawesome/solid/file-pdf
    - name: OSlings
      url: https://github.com/USF-CS326-F26/oslings-course
      icon: fontawesome/solid/code
    - name: Zoom
      url: https://usfca.zoom.us/
      icon: fontawesome/solid/video

extra_css:
  - stylesheets/extra.css

# NOTE: no polyfill.io. That domain was sold in 2024 and served malware; it is
# also unnecessary for every browser this course targets.
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - javascripts/mermaid-init.js
  - javascripts/schedule.js


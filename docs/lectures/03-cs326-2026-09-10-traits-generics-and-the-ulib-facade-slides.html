# Traits, Generics, and the `ulib` Façade

## CS 326 Operating Systems

L06 &middot; Thursday, September 10, 2026 &middot; exercises `07r_traits` (Sep 17), `08r_errors` (Sep 18)

---

## Learning Objectives

- Explain why a `no_std` kernel cannot rely on a language runtime
- Define a trait and implement one for several unrelated types
- Write generic functions with trait bounds; choose `impl Trait` vs `dyn Trait`
- Describe **monomorphization** and predict how many copies are emitted
- Distinguish `Option` (absence) from `Result` (failure), and use `?` and `From`
- Derive why `#[cfg(target_os = "none")]` beats a Cargo feature

---

## Abstraction Without a Runtime

A **runtime** is code shipped with your program that does work you never wrote &mdash; Java's collector and interface dispatch tables, Go's goroutine scheduler, C's `crt0` and dynamic loader. A kernel has **none** of it, because a kernel *is* what everything else runs on.

C has no interfaces, so every serious project hand-builds one:

```c
struct file_operations {          /* Linux, ~30 function pointers */
    ssize_t (*read) (struct file *, char __user *, size_t, loff_t *);
    int     (*open) (struct inode *, struct file *);
    /* ... every filesystem fills this in ... */
};
```

It checks **nothing**: a null slot, the wrong slot, a pointer to the wrong struct &mdash; compile-time-detectable mistakes that C detects at 3 a.m.

## A Trait Is a Contract

```rust
pub trait Out {
    fn puts(&mut self, s: &str);      // required method
}
```

- Signature + semicolon = **required**: no `impl` is complete without it
- A trait holds **no data**; you can never build a value of one
- It is a statement *about* types, not a type

Real code: `Out` (`shell.rs`) in the reference kernel.

---

## Implementing It &mdash; and What It Is Not

```rust
struct ConsoleOut;                    // unit struct: zero bytes

impl Out for ConsoleOut {
    fn puts(&mut self, s: &str) { uart::puts(s); }
}
```

- A *different* block from plain `impl Type`; all required methods or the compiler names the one you missed
- **Not a base class**: no inheritance, no shared fields, no constructor
- `ConsoleOut` and a test buffer are related only by having answered the same question

<div class="highlight-box">
Nothing in <code>Out</code> says "buffer" or "device". It says: <strong>can be handed a <code>&amp;str</code></strong>.
</div>

---

## Default Methods

```rust
pub trait Out {
    fn write_str(&mut self, s: &str);          // required

    fn write_line(&mut self, s: &str) {        // default
        self.write_str(s);
        self.write_str("\n");
    }
}
```

`write_line` calls `write_str` on a `self` whose type is **not yet known** &mdash; implementers that do not exist yet also get this body.

A fifth output sink costs zero lines of newline handling.

---

## Generics, and the Bound That Saves Them

Inside `fn shout<T>(v: T)` you can do **nothing** with `v` &mdash; not print it, compare it, or call a method on it. `T` could be a `u8`, a `[Proc; 64]`, or a closure, and one body must be correct for all of them.

```rust
pub fn log_all<O: Out>(out: &mut O, lines: &[&str]) {
    for line in lines {
        out.write_line(line);          // legal: the bound proves it exists
    }
}
```

<div class="highlight-box">
The bound is a contract in <strong>both</strong> directions: to the body, exactly what it may assume; to the caller, exactly what it must prove. "No method named <code>write_line</code> found for type parameter <code>O</code>" means you forgot it.
</div>

---

## Four Spellings, Three Meanings

```rust
fn log_all<O: Out>(out: &mut O, lines: &[&str]);          // inline bound
fn log_all<O>(out: &mut O, lines: &[&str]) where O: Out;  // where clause
fn log_all(out: &mut impl Out, lines: &[&str]);           // impl Trait
fn log_all(out: &mut dyn Out, lines: &[&str]);            // dyn Trait
```

- 1, 2, 3 compile to **identical code**
- `where` when the bound list crowds out the signature
- `impl Trait` when the parameter is needed once and never named
- 4 is a different thing entirely

---

## Monomorphization

```text
 one source function       what the compiler emits
 ───────────────────       ───────────────────────
 fn trace<S: Scheduler,  ┌──> trace::<RoundRobin, StringOut>
          O: Out>        │      RoundRobin::pick_next  (direct)
                         │      StringOut::write_str   (inlined)
 used with               ├──> trace::<Priority, StringOut>
  (RoundRobin,StringOut) │      Priority::pick_next    (direct)
  (Priority,  StringOut) │      StringOut::write_str   (inlined)
  (Priority,  CountingOut)──>  trace::<Priority, CountingOut>
 3 combinations used,           Priority::pick_next    (direct)
 so 3 copies, not 2 x 2 = 4.    CountingOut::write_str (inlined)
```

**Static dispatch**: no trait, no lookup, no pointer chasing &mdash; only the combinations actually used are instantiated.

<div class="info-box">
The abstraction is not cheap, it is <em>gone</em> &mdash; which is what makes a trait usable on a kernel's scheduling path. The price is paid in <strong>code size</strong>.
</div>

---

## `dyn Trait` and the Vtable

```text
 let out: &mut dyn Out = &mut ConsoleOut;   // FAT POINTER: 2 words

  ┌───────────────┬────────────────┐
  │ data pointer  │ vtable pointer │
  └──────┬────────┴───────┬────────┘
         v                v
  ┌──────────────┐  ┌──────────────────────────────┐
  │ ConsoleOut   │  │ [0] drop_in_place -> no-op   │
  │ (zero bytes) │  │ [1] size = 0  [2] align = 1  │
  └──────────────┘  │ [3] puts -> ConsoleOut::puts │
                    └──────────────────────────────┘

  out.puts("hi")  =>  ld t0, 8(a0)   # vtable pointer
                      ld t0, 24(t0)  # puts slot
                      jalr t0        # indirect: nothing inlines
```

---

## Choosing Between Them

| | `impl Trait` / `<T: Trait>` | `dyn Trait` |
|---|---|---|
| Dispatch | compile time | one indirect call |
| Inlining | yes | no |
| Code size | one copy per type used | one copy total |
| Pointer | one word | two words (fat) |
| Mixed storage | impossible | `Vec<Box<dyn Trait>>` |

The last row decides most cases. Neither is the "advanced" one.

## rv6 #1: the `Scheduler` Trait

```rust
// sched.rs — exercise 36k
pub trait Scheduler {
    fn pick_next(&mut self, states: &[ProcState]) -> Option<usize>;
}
```

*Policy* (which process runs) is separated from *mechanism* (how the CPU is handed over &mdash; hand-written assembly you touch once).

`RoundRobin` at `sched.rs` keeps a rotation cursor; a `Priority` policy keeps a table. The loop never changes.

---

## Three Decisions, and the Lineage

- **`&mut self`** &mdash; a policy may remember something between calls (the rotation cursor); a stateless one ignores it
- **`&[ProcState]`, not `&mut [Proc]`** &mdash; the policy cannot mark a process running, free one, or touch a page table
- **`Option<usize>`** &mdash; "nothing is runnable" is an ordinary answer, so it gets a *value*, not an error and not a panic

| System | How policy is expressed |
|---|---|
| **xv6** | round-robin scan hardcoded inline in `scheduler()` |
| **Linux** | `struct sched_class` &mdash; function pointers per scheduler |
| **rv6** | `trait Scheduler` &mdash; the same design, checked by the compiler |

## rv6 #2: the `Out` Trait

```rust
// shell.rs / :334 / :345
pub trait Out { fn puts(&mut self, s: &str); }

struct ConsoleOut;
impl Out for ConsoleOut { fn puts(&mut self, s: &str) { uart::puts(s) } }

let mut out = ConsoleOut;        // the test substitutes a buffer here
sh.exec(&line, &mut out);        // exec takes &mut dyn Out
```

Not a mock, not a test-only path: the commands were **always** written against `Out`, so the test runs the same instructions the real machine will.

---

## Errors: a Kernel Cannot Throw

- **Nothing to unwind into** &mdash; mid-trap, privilege level and stack have already switched; the "caller" is a program in another address space that never heard of Rust
- **Nobody to catch** &mdash; unwinding needs a personality routine and DWARF tables; `no_std` has neither, and rv6 sets `panic = "abort"`
- **Stopping is not an option** &mdash; an unhandled exception kills a process; in an OS it kills the machine

<div class="highlight-box">
So failure travels the way every other answer travels: <strong>as a return value</strong>.
</div>

---

## `Option` for Absence, `Result` for Failure

```rust
enum Option<T>    { Some(T), None }
enum Result<T, E> { Ok(T),   Err(E) }
```

- `None` says *nothing happened* &mdash; and nothing has gone wrong
- `Err(FsError::NameTooLong)` says *what* went wrong, so the caller can decide
- `Result` is `#[must_use]`: ignoring one is a compiler warning

`.ok_or(e)` is the bridge, and the line where the **policy** lives:
`lookup(name).ok_or(ExecError::NotFound)?` &mdash; `Built` (`exec.rs`)

---

## Your Own Error Type

```rust
// fs.rs
pub enum FsError {
    NotFound,     AlreadyExists,  NotADirectory,  IsADirectory,
    NoFreeInode,  DirFull,        NameTooLong,    FileTooBig,
}
```

- The caller `match`es a *named* failure, not an integer
- `shell.rs`: `touch` treats `AlreadyExists` as success
- Grow the enum later and every `match` needing a new decision stops compiling

---

## `?` and Its Desugaring

```rust
let inum = fsg.dirlookup(dir, name)?;

// means exactly:
match fsg.dirlookup(dir, name) {
    Ok(v)  => v,
    Err(e) => return Err(From::from(e)),
}
```

`From::from` &mdash; the error is **converted** on the way out. Same types? Free: the blanket `impl<T> From<T> for T` is the identity.

Works only inside a function that itself returns `Result` or `Option`.

---

## `From`: the Joint Between Layers

```rust
pub enum ShellError { Fs(FsError), Exec(ExecError), BadArgs }

impl From<FsError> for ShellError {
    fn from(e: FsError) -> ShellError { ShellError::Fs(e) }
}
```

Now one function may `?` on `Result<_, FsError>` **and** `Result<_, ExecError>`, with no visible conversion.

Written once per error-type *pair*, not per call site. Direction is fixed: specific inner error &rarr; general outer one.

---

## Where a `Result` Becomes a Number

```text
  layer                      type it speaks in          what it can say
  ─────────────────────────────────────────────────────────────────────
  cat.rs (user program)      Result<usize,ulib::Error>  Error(-1)
  ulib::read    lib.rs   isize, read out of a0      -1
  ══ trap boundary ══ one register, no types, another address space ══
  sys_read      syscall.rs  isize                   -1   <- cause lost
  FS.read_at    fs.rs    Result<usize, FsError>     IsADirectory, ...
  dirlookup     fs.rs    Result<usize, FsError>     NotFound
```

The collapse belongs in **one** place: the boundary. Everything behind it speaks `FsError`.

---

## `ulib`: the Design Problem

- September: you write `cat.rs` on a laptop; `cargo test` grades it
- December: you have a RISC-V kernel with files, fds, `exec`, user mode
- Goal: the **same source file** &mdash; same bytes, not a port &mdash; runs on both

The two environments share nothing:

| | laptop | rv6 |
|---|---|---|
| `read` | libc &rarr; macOS/Linux | `ecall`, number in `a7` |
| `std` | yes | no |
| heap | yes | no |

---

## One Seam, Two Backends

<div class="mermaid">
flowchart TD
    SRC["commands/src/bin/cat.rs\none file, zero cfg attributes"]
    SRC --> U["ulib\nread / write / open / close / exit"]
    U --> C{"target_os == none ?"}
    C -->|no| H["sys/host.rs\nstd::fs, std::io,\nor a capture buffer"]
    C -->|yes| R["sys/rv6.rs\necall, a7 = syscall number"]
    H --> HOST["cargo test, September"]
    R --> K["your rv6 kernel, December"]
</div>

---

## The Whole Mechanism

```rust
// ulib/src/sys/mod.rs
#[cfg(target_os = "none")]
mod rv6;
#[cfg(target_os = "none")]
pub(crate) use rv6::*;

#[cfg(not(target_os = "none"))]
mod host;
#[cfg(not(target_os = "none"))]
pub(crate) use host::*;
```

Both backends expose the same five functions, so `lib.rs` above them has **no `#[cfg]` at all**. Your command file has none either &mdash; two lines of ceremony (`cat.rs`).

---

## Why Not a Cargo Feature?

- `target_os` is **derived** from `--target`: one source of truth, cannot disagree with the machine you are building for
- **Forget** `--features rv6` on a RISC-V build &rarr; a wall of `std`, `panic_handler`, `eh_personality` errors that never say "you forgot a feature"
- **Set it wrongly** on the host &rarr; a program that runs `ecall` on macOS, from a build that warned about nothing
- Features are **additive and unified**: one crate enabling `ulib/rv6` enables it everywhere in the graph

<div class="highlight-box">
Features add capabilities. They do not choose between alternatives.
</div>

---

## Testing Through the Seam

```rust
let out = testing::run_with_files(
    &["cat", "a.txt"],
    &[("a.txt", b"hello\nworld\n")],
    super::run,
);
assert_eq!(out.out(), "hello\nworld\n");
```

`testing::run` (`testing.rs`) diverts writes into a thread-local capture buffer and calls your `run` directly &mdash; no process spawned, no temp files, and **byte-identical source** to what will run on rv6.

---

## Summary

1. **No runtime** &mdash; every abstraction is assembled at compile time
2. **Trait** = named contract; required methods plus free default methods
3. **Bound** = what the body may assume and the caller must prove
4. **Monomorphization** = one copy per combination used; calls direct and inlined
5. **`dyn`** = one indirect call, one copy, and the ability to *store* the thing
6. **Failure is a value**: `Option` for absence, `Result` for failure, `?` + `From` to propagate
7. **`ulib`** = one seam, two backends, chosen by `#[cfg(target_os = "none")]`

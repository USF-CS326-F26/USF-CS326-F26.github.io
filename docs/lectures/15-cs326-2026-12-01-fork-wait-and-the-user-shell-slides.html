<!-- .slide: id="recap-two-tables" class="exam" -->

## Recap · two tables, not one

Unix splits what rv6 keeps in one entry. After `open`, `fork`, and `dup(3)` in the child:

```text
parent  fd 3 --+
child   fd 3 --+--> open file: offset 120, write-only, count 3 --> inode 7
child   fd 4 --+
```

- Each process's **descriptor table** points into one system-wide **open-file table**
- An open file holds offset, mode and a **reference count**: `open` makes 1, `dup` and `fork` add, `close` subtracts, 0 frees
- rv6 keeps the whole entry per process: no middle table, no count

Notes:
- On the final, Tue Dec 8: the Nov 24 page's For the exam (exam-two-tables, exam-refcount), reused as the recap.
- The count is why one process's `close` never cuts off another: the open file goes only when its last descriptor does.
- **Q:** "Why does rv6 get away with one table?" It never shares an entry: `fork` copies each one by value, and there is no `dup`, so there is nothing to count.

---

<!-- .slide: id="recap-shared-offset" class="exam" -->

## Recap · one offset, shared

`dup` copies a pointer; `fork` copies the descriptor table, pointer by pointer. Either way, two descriptors share one offset:

```text
(echo a; echo b) > f     two children write f in turn: two lines
open("f") twice          two open files, two offsets, on any system
rv6, after a fork        the child's offset is a copy: its write can overwrite
```

<div class="info-box">Friday's <code>fork</code> copies the file table. In rv6 each offset comes along by value, so parent and child move separately.</div>

Notes:
- On the final (the Nov 24 page's exam-shared-offset). This is the bridge into `51k`: "the child's open files are copied" means something different for an offset in rv6 and in Unix.
- ↓ Problem 3, under exam-two-calls, shows both behaviors in one redirect.
- **Q:** "Which one does the final want?" Both. The shared offset is the Unix answer; rv6's copy is the simplification you should be able to name, with what it breaks.

<!-- .slide: id="fri-51k" -->

## Friday · `51k_fork_wait`: one call, two returns

`fork` creates a **child**, a copy of the calling **parent**. Both return from the same call, with the same memory; only the return value differs:

```rust
let pid = fork();
match pid {
    0 => run_as_child(),            // only the copy sees 0
    p if p > 0 => wait_for(p),      // the parent holds the child's pid
    _ => complain("no free slot"),  // -1: nothing was copied
}
```

Zero is safe: no process has pid 0.

Notes:
- In `52k` your shell copies itself for every command, then waits for the copy. `51k` builds the copy, the ending, and the wait.
- Read the `match` as one question answered twice: each process takes its own arm. The parent keeps the pid to tell which child `wait` hands back; -1 means no free slot or no memory, and nothing was made.
- **Q:** "Which one runs first after a fork?" In rv6, the parent: nothing takes the CPU from it until it waits or exits. On Linux either may, and a correct program must not care.

---

<!-- .slide: id="51k-child" -->

## What the child gets

Copy what the program can see; make new what the kernel keeps about the process.

| The child's… | Is | Because |
|---|---|---|
| user pages | copied, same addresses | writes stay private |
| open files | copied | fd 1 still means the same |
| saved registers | copied, except `a0` | it resumes where the parent will |
| pid | new | a pid names one run |
| kernel stack, trapframe page | new | each process traps on its own |
| parent | the caller | its exit status needs an addressee |

Notes:
- PS3 Problem 7 is this table. The memory copy walks the parent's page table and gives the child a fresh page for every user page, same address, same permissions; only the trampoline is shared. Open files are copied by value, offset included; a Unix child shares each open file and its offset (recap-shared-offset), and the final asks for that difference.
- The copied program counter puts the child just past the `ecall`, like the parent. The kernel plants 0 in the child's saved `a0`; the parent's `a0` gets the pid the ordinary way, since the trap handler stores every system call's return value in the caller's saved `a0` (PS3 P7's last question). ↓ below: copied or shared, then the cost of a copy (optional).
- **Q:** "Why not share the pages, since they are identical?" Then a write by one would appear in the other. Unix does share them, read-only, and copies a page at its first write: copy-on-write, ↓ below.

--

<!-- .slide: id="deeper-copied-shared" class="deeper" -->

## Copied or shared: rv6 and Unix

- rv6 copies memory eagerly: `copy_level()` (`vm.rs`) duplicates every user page before the child runs.
- Unix copies it logically: both processes map the same frames read-only, and a page is copied only when one of them writes it and faults. That is **copy-on-write**, and it makes `fork` then `exec` copy almost nothing.
- Open files go the other way on Unix (51k-child): memory is copied because processes must stay isolated, and offsets are shared because a redirected stream must stay coherent.

--

<!-- .slide: id="deeper-cost" class="deeper" -->

## The cost of a copy

- Before copy-on-write, BSD tried `vfork` (1979), which copies nothing: the child borrows the parent's memory, parent suspended, until it calls `exec` or exits.
- So a child that writes a variable writes the parent's.
- Threads make `fork` worse. The child gets only the calling thread, but every lock in whatever state it was in, so a lock another thread held stays locked forever. POSIX therefore allows only async-signal-safe calls between `fork` and `exec` in a threaded program.

---

<!-- .slide: id="51k-zombie" -->

## `exit`, the zombie, and `wait`

`exit(status)` cannot free the slot: the status is for a parent who may not be listening. The process becomes a **zombie**, holding its pid and status until `wait` **reaps** it:

| The caller has… | `wait` |
|---|---|
| a zombie child | copies out its status, frees the slot, returns its pid |
| children, none finished | yields, then looks again |
| no children at all | returns -1 at once |

Notes:
- Week 9 drew `Zombie` in the state diagram; this is the exercise that finally uses it.
- The middle row is how rv6 blocks: the scheduler marked the parent `Running`; `wait` marks it `Runnable` again, yields, and rescans whenever it is picked. No process is ever `Sleeping`. ↓ below: the status word, and waiting without polling (optional).
- **Q:** "What if the parent never calls `wait`?" The zombie holds its slot until the run ends. On Linux, `ps` shows it as `Z` until its parent exits and `init` reaps it.

--

<!-- .slide: id="deeper-status" class="deeper" -->

## The status word

- rv6 keeps an `isize` of exit status and copies four bytes of it to the parent.
- Unix, Linux included, packs several answers into one `int`: bits 15–8 hold the low 8 bits of the exit status, and the low 7 bits hold the signal that killed the process, or 0.
- `WEXITSTATUS` and `WTERMSIG` unpack them.
- So on Linux `exit(256)` reaches the parent as 0 and `exit(-1)` as 255, which is why shell exit codes stay small.

--

<!-- .slide: id="deeper-sleep" class="deeper" -->

## Waiting without polling

- rv6's `wait` polls: a parent with a running child yields, rejoins the rotation, and rescans all 64 slots whenever it is picked. That is correct on one cooperative CPU, but a parent can spend many turns finding nothing.
- xv6 sleeps instead: `wait` parks the parent on a channel, its own address, and `exit` calls `wakeup` on its parent.
- Linux puts the parent on a wait queue and sends it `SIGCHLD`.
- Either way, looking again becomes being told, and week 9's unused `Sleeping` state is where such a parent would wait.

---

<!-- .slide: id="51k-scheduler" -->

## The scheduler finally has work

After a `fork`, the running parent has a `Runnable` child: your `36k` round robin picks, and your `35k` switch switches. rv6 is **cooperative**: a process leaves the CPU only by yielding inside `wait` or by exiting.

In `forktest` the child exits 7, and the parent exits with that plus 10. States as each turn ends:

```text
turn     what happens                             slot 0    slot 1    prints
parent   forks, writes, wait finds no zombie      Runnable  Runnable  parent
child    fork returned 0; writes; exit(7)         Runnable  Zombie    child
parent   wait reaps slot 1, status 7; exit(17)    Zombie    Unused
```

Notes:
- The loop asks your policy for a slot, switches in, and gets the CPU back only when that process lets go of it. During its own turn a process is `Running`; the table shows where each turn leaves it. The `44k` timer still ticks, but nothing takes the CPU away, so `parent` prints first. PS3 Problem 8 is this trace with two children.
- A process that has never run starts at `forkret`, which takes the trap-return path into user mode. ↓ below: Problem 1 (predict the output).
- **Q:** "Why does a new child start at `forkret` and not at the `ecall`?" Its kernel side has never run, so its first context is forged, as in week 9. `forkret` takes the ordinary trap-return path, and `sret` lands at the copied program counter, just past the `ecall`.

--

<!-- .slide: id="problem-1" class="deeper" -->

## Problem 1: Predict the output

This program runs alone on rv6's cooperative scheduler. Each `write` puts one letter on fd 1:

```text
write "a"
p = fork()
if p == 0 { write "b"; q = fork(); if q == 0 { write "c"; exit(1) }; write "d"; exit(2) }
write "e"
wait(&s)
write "f"
exit(s)
```

1. What prints, and with what status does the first process exit?
2. Which process is never reaped by its own parent, and who frees it?
3. On Linux, with preemption, which letters race, and can any letter follow `f`?

--

<!-- .slide: id="problem-1-solution" class="deeper" -->

## Problem 1 · solution

**1.** **`aebdcf`**, status 2. Call the processes P, A (P's child) and B (A's child), in slots 0, 1 and 2:

```text
turn   prints   what happens
P      a, e     forks A; wait finds no zombie, yields
A      b, d     forks B; exit(2): Zombie
B      c        exit(1): Zombie, its parent A already a zombie
P      f        wait reaps A (status 2); exit(2): the run is over
```

<span>Round robin goes from slot 0 to 1 to 2 and back to 0, and nothing runs until the one before it yields or exits.</span> <!-- .element: class="small" -->

<span>**2.** B: its parent A exited without waiting. rv6 frees it with every other leftover when the first process finishes; on Unix, `init` would adopt and reap it.</span> <!-- .element: class="small" -->

<span>**3.** `e` races with `b`, `c` and `d`, since the child may run first; `c` races with `d`. And `c` can print after `f`, even after P exits: nothing waits for B.</span> <!-- .element: class="small" -->

---

<!-- .slide: id="51k-one-thing" -->

## The one thing to get right · `51k`

`[fail] only the parent ran`, and the output shows `parent` twice. Why?

The child's registers were an exact copy, so its saved `a0` still held the parent's value from before the call, and it took the parent's branch.

<div class="highlight-box">A copy that differs in nothing is not yet a child.</div>

Notes:
- Two `parent` lines means two processes took the parent's arm: the copy worked, and the one difference was missing.
- **Q:** "Why can't the kernel just return 0 to the child?" The child never made the call: it has not run at all. The kernel can only arrange what the child finds when it first returns to user mode, and the return value lives in its saved `a0`.

---

<!-- .slide: id="exam-init" class="exam" -->

## The process tree, `init`, and a stale parent

- Processes form a **process tree** rooted at `init`, pid 1, which starts the shell. **Orphans** pass to `init`, whose `wait` loop reaps them.
- rv6 has no `init`: the kernel frees leftovers when your `run` ends.
- rv6 records the parent's slot, and slots recycle: the next occupant inherits a child it never forked.

<div class="info-box">Record the parent's pid, or reparent at exit.</div>

Notes:
- On the final, Tue Dec 8 (the page's exam-init and exam-stale-parent): final.md names "the process tree and reparenting". An orphan is a child whose parent exits first; PS3 Problem 9 (b) and (c) are this slide, and its (a) is the zombie slide.
- The stale pointer is week 9's slots-and-pids lesson again: a slot is a place and is reused, while a pid names one run. ↓ below: orphans on purpose, then Problem 2 (a child it never forked).
- **Q:** "Does this ever bite in rv6?" Only when a parent is reaped while its child lives, as in ↓ Problem 2, where a later process in that slot reaps a grandchild it never forked.

--

<!-- .slide: id="deeper-orphans" class="deeper" -->

## Orphans on purpose

- A **daemon**, a service with no terminal, wants no parent waiting on it, and its classic launch orphans it deliberately.
- The launcher forks; the child forks again and exits at once; the launcher reaps that child.
- The grandchild is now an orphan, adopted by `init`, and nobody else's concern.

--

<!-- .slide: id="problem-2" class="deeper" -->

## Problem 2: A child it never forked

Program P starts alone, as pid 1 in slot 0 of an empty table. A claim takes the lowest `Unused` slot:

```text
P: a = fork()
   if a == 0 { if fork() == 0 { exit(3) }; exit(5) }        // A, and its child G
   s1 = wait(&x);  s2 = wait(&y)
   c = fork()
   if c == 0 { if wait(&z) < 0 { exit(0) }; exit(z + 10) }  // C
   wait(&w);  exit(w)
```

Give each process's slot and pid, what every `wait` returns, and P's exit status on rv6. Then say what Unix does differently.

--

<!-- .slide: id="problem-2-solution" class="deeper" -->

## Problem 2 · solution

```text
process   slot   pid   parent pointer names
A         1      2     slot 0 (P)
G         2      3     slot 1 (A)
C         1      4     slot 0 (P)      C reuses A's slot
```

<span>P forks A and yields in its first `wait`. A forks G and exits 5; G exits 3. P's first `wait` reaps A: `s1 = 2`, `x = 5`, and slot 1 is `Unused`. G's parent pointer still names slot 1, not P, and P has no other child, so `s2 = -1`.</span> <!-- .element: class="small" -->

<span>P forks C into slot 1. C's `wait` finds G, a zombie whose parent pointer names slot 1, which is now C's: it reaps G, `z = 3`, and C exits 13. P reaps C and exits **13**.</span> <!-- .element: class="small" -->

<span>**On Unix,** pid 1 is `init` itself, so let P be an ordinary process there. A's exit hands G to `init`, which reaps it. `s1` and `s2` come out the same, but C has no children, so its `wait` returns -1, C exits 0, and P exits **0**.</span> <!-- .element: class="small" -->

---

<!-- .slide: id="fri-52k" -->

## Friday · `52k_userland`: replace the program, keep the process

After `fork` the child still runs the shell's code. **`exec`** replaces the program and keeps the process.

| Survives `exec` | Replaced by `exec` |
|---|---|
| pid, parent, process slot | the page table, and every user page |
| open files | code, data, stack, and argv |
| kernel stack, trapframe page | the four starting registers |

The old pages can go mid-call: `satp` holds the kernel's table until the trampoline's return path.

Notes:
- `49k` loaded a program into a fresh process; `52k` loads one into a process already running. The four registers are Nov 24's: program counter 0, `sp`, `a0` = argc, `a1` = argv.
- The surviving open files are how a shell hands a program its input and output: exam-two-calls, in a few slides.
- **Q:** "Isn't freeing the memory you are running in suicidal?" You are not running in it. From the trap until the trampoline's return path, `satp` names the kernel's table, so no instruction fetch touches the old pages; exam-sfence, in a few slides, is the same fact.

---

<!-- .slide: id="52k-no-return" -->

## `exec` does not return on success

Only a failed `exec` comes back, with -1, to a caller that is still itself. A successful one resumes somewhere else entirely:

```text
exec("mycat", argv) succeeds   next instruction: mycat's first, at address 0
exec("mycta", argv) fails      next instruction: the one after the ecall, a0 = -1
```

Read every line after an `exec` as its failure path, where a shell's child prints `exec: not found`.

Notes:
- Both rows are the trap-return path doing its usual job: resume at the saved program counter, on the saved page table. A success changed both; a failure changed nothing.
- **Q:** "Then how does the shell learn how the command went?" Not from `exec`: the shell never called it, its child did. The shell learns from `wait`, when that child, now `mycat`, exits.

---

<!-- .slide: id="52k-shell" -->

## The shell leaves the kernel

Since `46k` the shell has lived in the kernel. `sh` is a user program, started by the kernel shell's `run sh`, with the prompt `$ `:

```text
write "$ ", then read a line from fd 0 one byte per call, echoing each to fd 1
split the line into words: argv
if argv[0] is "exit": exit(0)
fork; the child calls exec(argv[0], argv), printing "exec: not found" if it returns
the parent waits, then loops
```

Every line but the split is system calls. `exit` is a **builtin**: its effect is on the shell.

Notes:
- The echo is why you see what you type: the kernel hands `sh` one byte per `read`, and `sh` writes it straight back on fd 1. Line assembly is `sh`'s job now.
- The kernel shell is still there underneath: `exit` at `$ ` brings back `rv6$`.
- **Q:** "Why is `exit` a builtin and not a program?" A program named `exit` would run in the child and end the child, and the shell would print the next prompt. Only the shell can end the shell.

---

<!-- .slide: id="52k-one-thing" -->

## The one thing to get right · `52k`

`[fail] execfail did not finish cleanly`. The program execs a name that does not exist and should go on to `exit(7)`. Why?

The failed `exec` had already given back the old program's pages, so its -1 returned into memory that was gone.

<div class="highlight-box">Let go of nothing old until everything new exists.</div>

Notes:
- This is Nov 24's rule, "a failed launch leaves no trace", with a harder customer: in `49k` a failure only had to free a half-built process; here the caller itself must carry on as if nothing happened.
- **Q:** "What can make an `exec` fail?" No such program, no free page, or arguments rv6 cannot copy: more than seven words, or a name or word over 31 characters. Each must return -1 to a caller whose memory is exactly as it was.

---

<!-- .slide: id="exam-two-calls" class="exam" -->

## Why `fork` and `exec` are two calls

Between them, the child runs the shell's code on its own copy of the file table. For `mycat notes.txt 2>&1` on Unix:

```text
close(2)                 the child's fd 2 is free
dup(1)                   returns 2, the lowest free fd: 2 now shares 1's open file
exec("mycat", argv)      exec keeps the table: errors go where output goes
```

The window can also close fds, or set the directory or limits, with calls that already exist. One `spawn` would need every such action as a parameter, as `posix_spawn` does.

Notes:
- On the final, Tue Dec 8 (exam-two-calls); PS3 Problem 10 is this slide, and it asks for two things done in the window: redirection, and closing fds or setting the directory or limits. Name the window (from `fork` returning 0 to the `exec`) and the rule that makes it work: open files survive `exec`. `mycat` never learns anything changed; it writes fd 2 as always. Copy-on-write keeps the copy cheap.
- ↓ below: one call instead of two, then Problem 3 (redirect in the window).
- **Q:** "Isn't copying the whole shell just to throw it away slow?" It would be, which is why Unix copies lazily: with copy-on-write, `fork` then `exec` copies almost nothing. The split buys expressiveness, not speed.

--

<!-- .slide: id="deeper-spawn" class="deeper" -->

## One call instead of two

- Fold `fork` and `exec` into one `spawn`, and every adjustment made in the window becomes a parameter: descriptors, the working directory, credentials, signal settings, the process group, resource limits, and on Linux namespaces and cgroups.
- The window needs none, because it is not an interface but a place to run code, so an adjustment invented later needs no new call.
- `posix_spawn` (POSIX 2001) shows the cost. Beside the path and argv it takes a list of file actions (`addopen`, `adddup2`, `addclose`) and an attributes object: a small language for what the window would have done.
- The strongest modern case against `fork` is Baumann and colleagues' "A `fork()` in the road" (HotOS 2019).

--

<!-- .slide: id="problem-3" class="deeper" -->

## Problem 3: Redirect in the window

`notes.txt` holds `the cat sat\n`. Your shell learns `<`: for `mycat < notes.txt`, its child points fd 0 at the file in the window.

1. `mycat` is never told about the redirect. Why does it still read the file?
2. A classmate moves the redirect before the `fork`. `mycat` still prints the file. What goes wrong afterward, on rv6 and on Unix?

--

<!-- .slide: id="problem-3-solution" class="deeper" -->

## Problem 3 · solution

<span>**1.** Open files survive `exec`, so `mycat` starts with fd 0 already naming `notes.txt`. With no file argument it reads fd 0, whatever that is, and never learns anything changed. The shell's fd 0, in its own table, is still the console.</span> <!-- .element: class="small" -->

<span>**2.** Moved before the `fork`, the redirect changes the shell itself. Its fd 0 is now `notes.txt`, so its next command line comes from the file, and the keyboard is gone. **On rv6** the shell's copy of the offset is still 0, so it reads `the cat sat` as a command and tries to run `the`. Then every read returns 0, which rv6's `sh` takes for a blank line, so it prints `$ ` forever. **On Unix** `mycat` moved the shared offset to the end, so the shell reads end of file and exits, as if you had pressed Ctrl-D. The window exists so that only the child changes.</span> <!-- .element: class="small" -->

---

<!-- .slide: id="exam-shell" class="exam" -->

## The shell is unprivileged

`sh` runs in user mode on its own page table. It cannot lock the filesystem, allocate a page, or see the process table; its only door is `ecall`.

So `cd` must be a builtin: a child that changes directory changes only itself.

<div class="info-box">A shell is an ordinary program: anyone can write one, and every request it makes is checked.</div>

Notes:
- On the final, Tue Dec 8 (exam-shell): final.md's Userland bullet, "what it means for the shell to be an ordinary unprivileged program".
- `sh` has no `cd`: rv6 has no directory system call yet, so only the kernel shell `rv6$` can change directory, and `open` still resolves every name in the root (↓ under exam-long). The builtin argument is Unix's, and it is the same as `exit`'s.
- **Q:** "Then how does the shell do anything privileged?" It never does; it asks. Every keyboard read and every screen write is an `ecall`, and the kernel checks each one: the descriptor, the buffer, the mode.

---

<!-- .slide: id="exam-sfence" class="exam" -->

## Why `exec` needs no `sfence.vma`

`exec` installs a whole new page table and never executes `sfence.vma`. Not a stale-TLB bug:

- `exec` changes only the process's record of its page table
- the CPU still translates through the kernel's table
- the new table reaches `satp` in the trampoline, between two `sfence.vma`s

<div class="info-box">PS3 P12 (a), (c): Week 11's <code>scause</code>, Week 7's VA split, Week 12's trampoline.</div>

Notes:
- On the final, Tue Dec 8 (exam-sfence); PS3 Problem 12 (b). The box is the page's exam-retrieval: P12 (a) and (c) are retrieval from Weeks 7, 11 and 12. Week 10 set the rule: the TLB does not notice page-table writes, so every `satp` change is fenced.
- No process reaches user mode except through the trampoline's return path, so a new table is always installed between fences.
- **Q:** "Couldn't the TLB still hold the old program's translations?" Only until that return path: the fences there discard them before the first user instruction of the new program runs.

<!-- .slide: id="fri-53k" -->

## Friday · `53k_ship_your_commands`: one source, two backends

In September you called `ulib`, never `std`. Its two private **backends** are picked by the compile target, so your command's code has no `cfg`. `rustc` prints the switch:

```text
$ rustc --print cfg --target riscv64gc-unknown-none-elf
target_os="none"
$ rustc --print cfg
target_os="macos"
```

On rv6 each system-call wrapper is one `ecall`, in `48k`'s convention:

```rust
fn getpid() -> isize {
    let pid: isize;
    unsafe { core::arch::asm!("ecall", in("a7") 11usize, lateout("a0") pid) };
    pid
}
```

Notes:
- Read `target_os = "none"` as "no operating system underneath"; it follows from the target, so it cannot disagree with the build. Each listing is one line of many, and the second is from a Mac. The only `cfg` in a command file is one `cfg_attr` line that turns on `no_std` for the kernel target.
- Read `in("a7") 11usize` as "the call number goes in `a7`", and `lateout("a0") pid` as "afterward, `a0` holds the answer". The numbers are your dispatch table's: `read` is 5, `write` 16.
- **Q:** "Why write `ulib` in September, when `println!` was right there?" For Friday: the same source compiles against `std` on your laptop and against your own system calls on rv6, unedited.

<!-- .slide: id="53k-ship" -->

## What `oslings ship` does

rv6 cannot read ELF, so `oslings ship` makes each command something it can load:

```text
your September cat.rs           unchanged
  built for riscv64gc-unknown-none-elf, in release mode
an ELF file                      linked at address 0
  loadable segments laid out by address; gaps become zeros
a flat image                     copied to address 0, run from its first byte
  embedded in the kernel with include_bytes!
mycat                            a name exec can find
```

The `my` keeps rv6's own `echo` and `cat` demos from running instead. Each image is a few KiB, far inside the loader's 64 KiB.

Notes:
- Inside the kernel they are `myecho`, `mycat`, `mywc` and `mygrep`. No allocator, no formatting machinery and no runtime came along, which is why the images are so small.
- Extra credit `54k_elf_loader` teaches rv6 to read the ELF file itself. ↓ below: what a flat image costs, and `54k`; then Problem 4 (size a shipped command).
- **Q:** "Why must the entry point be address 0?" A flat image has no header saying where to start, so rv6 starts at its first byte, and `oslings ship` refuses an image whose entry is anywhere else (↓ below).

--

<!-- .slide: id="deeper-flat" class="deeper" -->

## What a flat image costs, and `54k`

- Two of `oslings ship`'s refusals exist only because its output is flat.
- The image must start at 0 and its entry must be 0, since a flat image has nowhere to record either; `ulib`'s entry macro and the user linker script arrange both.
- The loader maps every image page alike, `R X U`, so the only page a shipped command can store to is its stack page.
- **Extra credit · `54k_elf_loader`:** `oslings ship` does rv6's loading ahead of time, and the flat image forgets what the ELF file knew. `54k` moves that job into the kernel, reading the file's own headers at `exec` time, and lifts both limits. Done outside class; not on the exam.

--

<!-- .slide: id="problem-4" class="deeper" -->

## Problem 4: Size a shipped command

`oslings ship` produces a 9,500-byte image for a command you ship as `mytally`.

1. How many pages hold the image, and how many zero bytes end the last one?
2. List every page the running process maps, with its permissions.
3. You add `static mut HITS: u32 = 0;`, increment it on every match, and print it at the end. The command now dies at its first match. Why, and what happens to the `$ ` shell that ran it?

--

<!-- .slide: id="problem-4-solution" class="deeper" -->

## Problem 4 · solution

<span>**1.** Three pages, since 8,192 < 9,500 ≤ 12,288. The last holds 9,500 − 8,192 = 1,308 image bytes and 4,096 − 1,308 = 2,788 zeros, because each page is zeroed before the copy. The image uses 14.5% of the 64 KiB budget.</span> <!-- .element: class="small" -->

<span>**2.** The pages it maps:</span> <!-- .element: class="small" -->

| Virtual address | Contents | Flags |
|---|---|---|
| `0x0000`, `0x1000`, `0x2000` | the image | `R X U` |
| `0x1_0000` | the stack page; argv at its top, below `0x1_1000` | `R W U` |
| `0x3F_FFFF_E000` | the trapframe | `R W` |
| `0x3F_FFFF_F000` | the trampoline | `R X` |

<span>Pages 3 through 15 stay unmapped, so running off the image faults instead of reaching the stack.</span> <!-- .element: class="small" -->

<span>**3.** `HITS` starts at zero, so it lives in `.bss`, which `oslings ship` folded into the image as zeros. Image pages have no `W`, so the first increment is a store page fault, `scause` 15. A fault ends the whole run in rv6: the scheduler frees every process but the root, the kernel shell then frees `sh`, and `rv6$` prints `run: the program faulted`.</span> <!-- .element: class="small" -->

---

## The one thing to get right · `53k`

A command that passed `cargo test` in September stops `oslings ship` with ``cannot find macro `format` in this scope``. Why?

On your laptop the `std` prelude supplied it. On the kernel target the crate is `no_std`, with no allocator.

<div class="highlight-box"><code>format!</code>, <code>println!</code>, <code>Vec</code> and <code>String</code> do not exist on rv6.</div>

Notes:
- The compiler error teaches: "cannot find" means the name was never in scope on this target, not a typo. The Dec 4 prep's second question asks this. Its answer gives the size reason: `core`'s `write!` does compile but drags in `core::fmt`, 12–18 KiB. This slide gives the earlier reason: `println!` is `std`'s, and on rv6 it does not exist.
- **Q:** "Why does `format!` need an allocator?" It returns a `String`, which lives on the heap, and a shipped command has no heap: its only writable memory is one stack page.

<!-- .slide: id="53k-layers" class="exam" -->

## The long question, one layer per line

For `$ mycat notes.txt`, from Enter to the next prompt:

```text
UART, PLIC   Enter: IRQ 10 while sh waits in read; trap to stvec, scause 0x80…09
console      the handler claims 10, moves the byte into the ring, completes
sh           read(0) returns 1; sh echoes it on fd 1, sees Enter, splits words
fork         ecall, a7 = 1: a copy of sh, saved a0 = 0; sh's wait yields
scheduler    round robin picks the child: forkret, then sret into its copy of sh
exec         ecall, a7 = 7: finds mycat's shipped image, builds a new page table
user mode    sepc = 0, satp = the new table, SPP = 0; sret, a0 = 2, a1 = argv
files        open returns 3; read(3), write(1) trap with scause 8, a7 = 5 and 16
UART         the console fd hands each byte of write(1) to the UART driver
exit, wait   exit(0) leaves a zombie; sh reaps it, writes "$ ", reads again
```

The past form, `rv6$ ls`, never leaves the kernel shell: no `fork`, `exec` or user mode.

Notes:
- On the final, Tue Dec 8: the long question (the page's 53k-layers). Walk the ten lines aloud, about a minute each, and name the exercise behind each: `43k`/`44k` and `45k`; `45k`; `52k`; `51k`; `36k` and `35k`; `49k`, `52k` and `53k`; `48k`; `50k`; `50k` (and `41k`'s driver, if you did the extra credit); `51k`.
- final.md asks for the component that acts and the CSR or data structure involved at each step: the PLIC claim, the ring, the saved `a0`, the state array, the page table, `sepc` and `satp`, `a7`, the file table, the zombie's status.
- **Q:** "Where does line assembly happen?" In `sh` itself: it reads one byte per call and echoes each, so the kernel's console only buffers bytes. (The past form's `rv6$ ls` assembles its line inside the kernel shell and runs `ls` there, which is why this deck walks `mycat`.)

<!-- .slide: id="deeper-missing" class="deeper" -->

## What rv6 still lacks

- `ls` at `rv6$` is still a kernel-shell command, and it cannot become a user program yet: rv6 offers no system call to read, make, or change into a directory.
- That is the price of a userland: every power the kernel keeps must be handed out again, one system call at a time.
- Also missing are `dup`, signals, copy-on-write, preemption, and a second hart.

---

<!-- .slide: id="summary" -->

## Summary

- Unix has two tables; `dup` and `fork` share one offset
- `fork` returns twice; the child differs in one saved register
- `exit` leaves a zombie; `wait` reaps, yields, or returns -1
- `exec` keeps the process and files, returning only on failure
- `sh` is unprivileged; redirection lives between `fork` and `exec`
- `ulib` picks a backend by target; `ship` makes a flat image

Notes:
- One sentence per bullet, in the order of the page. Every bullet is Friday's or the final's.
- **Q:** "What should I study for the final from today?" The exam slides, then Practice Set 3 on paper; the page's four problems are the same material.

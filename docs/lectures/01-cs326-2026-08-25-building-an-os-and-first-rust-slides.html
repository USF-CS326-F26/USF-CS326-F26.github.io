<!-- .slide: id="course-os" -->

## What is an operating system?

"Linux, macOS, Windows, Android" is a list of **examples**, not a definition —
and useless for building one. Better question: what must be true for **two
programs to run on one computer** without either knowing the other exists?

A bare machine has exactly one of everything: one instruction stream, one span
of memory, one disk, one serial port. Sharing all of that, invisibly, is four
jobs.

Notes:
- The definition asks what must be true, not which products exist: two programs, one machine, and neither knows the other is there.
- Every singular resource is shared invisibly: your editor is not written differently because a compiler happens to be running.
- **Q:** "Is the kernel the whole OS?" In this course, yes: the kernel does the four jobs. The shell and the commands are programs it runs, and you write those too.

<!-- .slide: id="course-cpu" -->

## Job 1 &middot; Multiplex the CPU

One CPU, many programs. Run one for a few milliseconds, take the CPU away, give
it to another — fast enough that it looks simultaneous.

- **Process** — the kernel's record of one running program
- **Context switch** — save one set of registers, restore another
- **Scheduler** — the policy that picks who runs next

A program that never yields must still be interrupted, and only hardware can do
that: a **timer interrupt**, arriving whether or not the program consents. That
is why *preemptive* multitasking needs hardware and *cooperative* does not.

<div class="info-box">
<strong>Concurrency</strong> is many things in progress at once; <strong>parallelism</strong> is many things executing at the same instant. rv6 has one CPU — and every hard problem in this course shows up anyway.
</div>

Notes:
- A process is the kernel's record of one running program. The context switch (`35k`) is one of the few places the course drops into assembly, because naming registers one by one is something only assembly can say. It saves only the callee-saved registers plus `ra` and `sp` (Week 6).
- The forcible part: only a timer interrupt can take the CPU from a program that never yields.
- **Q:** "With one CPU, why would we need locks?" Interrupts: a handler can run between any two instructions. Races, locks and deadlock all appear with one CPU; more CPUs make them more frequent, not more possible.

<!-- .slide: id="course-memory" -->

## Job 2 &middot; Virtualize Memory

Two programs, both compiled to use address `0x1000`. If `0x1000` names one
physical location, they corrupt each other.

<div class="mermaid">
flowchart LR
    A["Program A\nuses 0x1000"] --> M["MMU\ntranslates through\nthe kernel's map"]
    B["Program B\nuses 0x1000"] --> M
    M --> PA["physical page\nfor A"]
    M --> PB["physical page\nfor B"]
</div>

- Programs see **virtual** addresses; the hardware translates every one through a map the **kernel** builds
- The map works in **pages** of 4096 bytes
- One bit in that map separates user pages from kernel pages — that bit is the wall

Notes:
- The MMU rewrites every address the CPU issues, through a table the kernel builds, in 4096-byte pages. You build the table in `33k` and switch it on in `39k`.
- The user bit is the wall: a wild pointer in `grep` kills `grep`, not the machine.
- **Q:** "What happens to an address with no entry?" The program cannot reach it at all: the hardware refuses the access and the kernel hears about it.

<!-- .slide: id="course-data" -->

## Job 3 &middot; Name Persistent Data

Memory is addresses. A disk is numbered blocks. Neither is a name a human can use.

```text
   what a program sees              what the storage has
   /
   +-- notes.txt   ------------->   block 4192, block 4193
   +-- bin/
       +-- grep    ------------->   block 7, block 8, block 9
```

- A **file** is bytes under a name; a **directory** is a table of names to files
- The kernel keeps the map between the two; programs only ever use the names
- rv6's filesystem lives in RAM — files do not survive a reboot. A scope cut, not an accident

Notes:
- A directory is a file whose contents are names pointing at other files. You build it in `40k`.
- In RAM on purpose: surviving power loss needs a block driver, a cache and a log.
- **Q:** "So my files vanish when QEMU exits?" Yes. Every boot starts from a fresh filesystem, by design.

---

<!-- .slide: id="course-devices" -->

## Job 4 &middot; Abstract Devices

A serial port is not a stream of bytes. It is a handful of registers at a fixed
address, and sending one character means waiting for a status bit, then storing
a byte.

- The kernel talks to the hardware once, in a **driver**, and hides it
- Everything above sees one interface — `read` and `write` on a **file descriptor**
- A program cannot tell a keyboard from a file from a pipe, and that is the point

<div class="info-box">
Every <code>println!</code> you have ever written bottoms out in a driver like the one you will write.
</div>

Notes:
- Sending one character is waiting for a status bit, then storing a byte to a register at a fixed address. You write that driver in `45k`, and the file-descriptor layer in `50k`.
- **Q:** "Why hide the device at all?" So a program written against `read` and `write` works on a keyboard, a file or a pipe, unchanged. Your `grep` is the proof in December.

<!-- .slide: id="course-machine" -->

## The machine: RISC-V on QEMU

- rv6 runs on **64-bit RISC-V** — the instruction set you met in CS 315
- On **QEMU's `virt` machine**: a computer that exists only in software, with one CPU, 128 MiB of RAM, a serial port, and a timer, all at fixed addresses
- In CS 315 you wrote a RISC-V emulator. QEMU is that idea, at full fidelity

<div class="info-box">
Not a compromise. An emulated machine can be stopped mid-instruction and inspected. Your kernel is a real RISC-V program that would boot on silicon.
</div>

Notes:
- RAM and devices share one address space: a store to one address is memory, to another it transmits a byte. That is memory-mapped I/O, and it is why a wild pointer in a kernel can do what one in an application cannot.
- The Memory Map guide lists every address; the cheatsheet keeps the ones you must not misremember.
- **Q:** "Could this kernel boot on real hardware?" It is a real RISC-V executable that would boot on silicon. QEMU is the choice because it can be stopped mid-instruction and inspected.

<!-- .slide: id="course-modes" -->

## Three privilege modes

| Mode | Who runs here | What it can do |
|---|---|---|
| **Machine** | firmware — for us, rv6's own boot code | everything, untranslated |
| **Supervisor** | the kernel | manage memory, handle traps, talk to devices |
| **User** | your programs: `sh`, `grep`, `cat` | ordinary instructions, its own memory only |

Privilege goes **down** by an explicit instruction and **up** only through a
trap. A program cannot make itself privileged — it *asks*, with a **system
call**, and the kernel decides.

Orientation only today. The mechanism comes in November, when you build it.

Notes:
- The ladder has one rule: down only by an explicit instruction, up only by a trap. A system call is a deliberate trap.
- Orientation only: the mechanism is `43k` and Week 11, after Midterm 1.
- **Q:** "Can a user program just jump into kernel code?" No. No user instruction raises privilege; the only way up is a trap, and it lands at the address the kernel chose.

<!-- .slide: id="course-why-m" -->

## Why machine mode exists

**S-mode is privileged with respect to *processes*. M-mode is privileged with respect to the *board*.**

- **Required** — S and U are optional; every hart leaves reset in M, untranslated. M is the floor, not a layer above the kernel
- **Untranslated** — `satp` governs S and U, so somebody has to run before the kernel's page table exists
- **Contains the kernel** — PMP is M-only, and every trap goes to M by default: your kernel gets page faults because `medeleg` handed them down
- **Hides the board** — emulates instructions this chip lacks; owns the timer, inter-hart interrupts, power-off

We run QEMU with `-bios none`, so rv6 *is* the firmware. It stays in machine mode
until `43k`, where `start.rs` sets `mstatus.MPP` to supervisor, points `mepc` at
`kmain`, and executes `mret`.

Notes:
- M is the only mode the specification requires, and every hart leaves reset in it with translation off. It is the floor, not a layer stacked above the kernel.
- On real boards OpenSBI is the M-mode firmware. With `-bios none`, rv6 is its own firmware, so it stays in M until `43k`.
- **Q:** "Why not keep the kernel in M for good?" S is where an operating system is written against the abstract machine; M is what makes one particular chip look like that machine. rv6 plays both parts until `43k`, then keeps only the kernel's.

<!-- .slide: id="course-why-both" -->

## Why learn both Rust and an OS

- An operating system is where a language's guarantees are tested hardest: no runtime beneath you, nothing to catch a bad pointer
- Rust is what new systems code is written in — drivers in Linux, Android, Windows components, most new infrastructure
- Learning Rust *on* a kernel means every feature arrives with a reason: ownership because pages have owners, `match` because hardware has states, traits because a scheduler is a policy

<div class="highlight-box">
By December you will have written a kernel in the language the industry is moving kernels to.
</div>

- Every Rust feature arrives with a kernel reason: ownership because pages have owners, `match` because hardware has states, traits because a scheduler is a policy.
- **Q:** "Is Rust really in kernels?" Yes: Linux merges drivers written in Rust, and Android and Windows ship Rust components. The claim is about new systems code, not rewrites.

<!-- .slide: id="course-rust" -->

## Why Rust, honestly

xv6 is C. Linux is C. The burden of proof is on Rust.

Kernel C bugs cluster into a few shapes:

- use a pointer after the memory was freed
- write past the end of a buffer
- read a value another CPU is halfway through writing
- free the same page twice

<div class="highlight-box">
In application code the OS catches these. In kernel code <strong>there is nothing beneath you</strong>. A use-after-free in the allocator does not crash — it hands the same page to two processes, and the symptom appears ten minutes later somewhere unrelated.
</div>

Notes:
- Four shapes: use after free, a write past a buffer, a value read while another CPU is halfway through writing it, a double free.
- In an application the OS catches them. In a kernel nothing is beneath you, so the symptom appears ten minutes later, somewhere unrelated.
- **Q:** "Does Rust make these impossible?" Most become compile errors: one owner, and many readers or one writer, never both. That is next week.

---

<!-- .slide: id="course-special" -->

## An OS is special — so Rust has `unsafe`

A kernel must do things no ordinary program does:

- execute **privileged instructions** and read hardware registers
- control **virtual memory** explicitly — build the page tables everything else relies on
- build its **own allocator** — there is no runtime beneath it to ask for memory

Rust's answer is not to relax the rules. It is one mechanism — the `unsafe`
keyword — that lets you step outside strict memory safety in small, marked
places.

<div class="info-box">
The dangerous part of the kernel becomes <strong>small and labeled</strong> instead of being the whole program. That is the argument for Rust, in one sentence.
</div>

Notes:
- Privileged instructions, every mapping, its own allocator: no compiler can check any of it.
- `unsafe` does not relax the rules; it marks where you take responsibility. When memory is corrupted, the suspects are a searchable list.
- **Q:** "So is rv6 full of `unsafe`?" No. It is concentrated in a few places you write yourself, starting with `21r`, and the full rules hold everywhere else.

*Part I · Thursday · `00r_hello_rust`*

## Bindings, `const`, and widths

```rust
let sectors = 2048;           // fixed from here on
let mut written = 0;          // declared to change
written += 512;
const SECTOR: usize = 512;    // compile time: the type is required
let ch: u8 = b'A';            // one byte, 0x41
let now: u64 = 10_000_000;    // one second of QEMU's clock
```

- Drop the `mut`: `E0384`, "cannot assign twice to immutable variable"
- Widths are the hardware's: `usize` is as wide as an address, 64 bits here; a `u32` counting 10 MHz ticks runs out in about seven minutes
- Rust never mixes them: `now + ch` is `E0308`, expected `u64`, found `u8`

Notes:
- Part I runs 14 minutes over four slides, two of them exam slides.
- Read `let mut` as "this name will be assigned again". rv6 names every device address as a `const`, in capitals; leave out the type and `rustc` stops with "missing type for `const` item".
- Width is a hardware decision: a UART register is 8 bits, an address 64. Integer `/` drops the remainder: `5000 / 512` is 9, and `%` gives the 392 left over.
- **Q:** "Why not let the compiler infer every type?" It infers where it can. A `const` must say, and a bare literal defaults to `i32`, which is rarely what a kernel means.

## Hex, by hand

```text
   0x   A    5    3    C
      1010 0101 0011 1100      = 42,300
```

- Each hex digit stands for four bits: `0b1010_0101` is `0xA5`. Underscores are only for the reader
- Each trailing hex zero is four clear low bits: `0x8003_7000`, with three, is 4 KiB-aligned; `0x8003_7010` only 16-byte aligned
- `0x8003_7000 − 0x8001_0000` is `0x2_7000` bytes. Drop three hex digits: `0x27`, 39 pages

Notes:
- On Midterm 1: the "decode the bits" shape, and PS1 Problem 4 (a) and (d).
- On this site hex is split every four digits and decimal every three, so `10_000_000` is visibly ten million. A slipped hex digit is off by a factor of sixteen, and the groups make one easy to spot.
- **Q:** "Do we convert to decimal on the exam?" Rarely. Work in hex, digit by digit: alignment and page counts fall out of trailing zeros and dropped digits.

<!-- .slide: id="exam-octal-as" class="exam" -->

## Octal, and `as` truncates

- `0o` is octal, three bits a digit: `0o755` is `111 101 101`, `rwx r-x r-x`
- `as` converts only when you ask. Widening is exact: `7u8 as u64` is 7
- Narrowing keeps the low bits, silently: `300u16 as u8` is 44
- Signed and unsigned keep the bits and change their meaning: `200u8 as i8` is −56

Notes:
- On Midterm 1. Octal's one common use is Unix permissions: owner, group, others. `493`, `0x1ED`, `0o755` and `0b1_1110_1101` are one value.
- `as` never fails and never warns, and that is its danger. 300 is `0x12C`; the low byte, `0x2C`, is 44. Likewise `0x1234_5678u32 as u8` is `0x78`, and `-1i32 as u32` is `0xFFFF_FFFF`.
- ↓ Problem 4 practices hex, octal and `as` together.
- **Q:** "Why doesn't `as` panic, like overflow does?" Keeping the low bits is what `as` means, not an error. When you want to hear about a value that does not fit, `u8::try_from(x)` returns an error instead.

<!-- .slide: id="problem-4" class="deeper" -->

## Problem 4: hex by hand

No calculator.

- **(a)** Write `0x5C` in binary and in decimal.
- **(b)** A file has mode `0o640`. Write it in binary. Who may read it, and who may write it?
- **(c)** Which of `0x8020_3000`, `0x8020_3010` and `0x8020_3008` are 4 KiB-aligned? Which are 16-byte aligned?
- **(d)** How far above `0x8010_0000` is `0x8012_C000`, in bytes and in 4 KiB pages?
- **(e)** What is `0x8012_C0A4u64 as u8`?

--

<!-- .slide: id="problem-4-solution" class="deeper" -->

## Problem 4 · solution

- **(a)** `5` is `0101` and `C` is `1100`: `0b0101_1100`, 64 + 16 + 8 + 4 = **92**.
- **(b)** `110 100 000`, or `rw- r-- ---`. The owner reads and writes, the group only reads, others get nothing.
- **(c)** Only `0x8020_3000` has its low twelve bits clear, so only it is 4 KiB-aligned. It and `0x8020_3010` are 16-byte aligned; `0x8020_3008` is only 8-byte aligned.
- **(d)** `0x2_C000` = 2 × 65,536 + 12 × 4,096 = **180,224 bytes**. Drop three hex digits: `0x2C` = **44 pages**.
- **(e)** `as u8` keeps the low byte: `0xA4`, **164**.

*Part II · Friday · `01r_control_flow`*

## `if` is a value, and three loops

```rust
let word = if status == 0 { "matched" } else { "no match" };
for reg in 0..8 { }             // 0 to 7: half-open
let mut n = 100;
let first = loop {
    n += 1;
    if n % 7 == 0 { break n; }  // the loop's value: 105
};
```

- `if` takes a `bool` (no truthiness), always braces, and one type in every branch
- `0..8` stops before 8, so `0..8` and `8..16` meet with no gap; `0..=8` includes 8
- `while` tests first; a `while` or `for` cannot `break` with a value, a `loop` can

Notes:
- Part II runs 15 minutes over four slides, one of them an exam slide. `grep`'s exit status from course-payoff becomes a word here.
- The errors teach the rules: a number as the condition is `E0308`, expected `bool`, found `i32` (write `status != 0`); a value with no `else` is `E0317`; `break n` in a `while` is `E0571`, because a `while` can end with no `break` to supply a value.
- **Q:** "Where is the ternary `? :`?" You just saw it: `if c { a } else { b }` is an expression, so Rust needs no separate operator.

<!-- .slide: id="exam-overflow" class="exam" -->

## Overflow: debug panics, release wraps

A `u8` named `x` holds 150 at run time. `x + 120` is 270, which does not fit.

| Expression | Debug build | Release build |
|---|---|---|
| `x + 120` | panics: `attempt to add with overflow` | `14` (270 − 256) |
| `x.wrapping_add(120)` | `14` | `14` |
| `x.checked_add(120)` | `None` | `None` |
| `x.saturating_add(120)` | `255` | `255` |

`cargo test` and `oslings run` build debug. It is one bug either way; only debug reports it.

Notes:
- On Midterm 1: PS1 Problem 4 (b) and (c). A debug build checks every operation; `--release` drops the checks for speed. Subtraction counts too: 1 from a `usize` that holds 0 panics.
- Each prefix states a design: `wrapping_` counts modulo 2ⁿ (a hash, a sequence number), `checked_` says there may be no answer, `saturating_` stops at the edge (a volume knob). `sub` and `mul` have all three.
- "At run time" matters. With the constant in view, `let x: u8 = 150; x + 120` does not compile: "this arithmetic operation will overflow". PS1 Problem 4 (b) as printed meets that; read it as a value that arrives at run time.
- **Q:** "Which one should be my default?" None. Plain `+` where you can show it cannot overflow, and one of the three wherever it can.

| | Debug | Release | Why |
|---|---|---|---|
| (1) | panics: `attempt to add with overflow` | `24` | 280 − 256 |
| (2) | `24` | `24` | the wrap, asked for |
| (3) | `None` | `None` | its type is `Option<u8>` |

<!-- .slide: id="01r-option" -->

## `Option`, in two arms

`to_digit` has no answer for `'x'`, so it returns an `Option<u32>`: `Some(d)`, or `None`.

```rust
fn digit_or_zero(c: char) -> u32 {
    match c.to_digit(10) {
        Some(d) => d,
        None => 0,          // not a digit: count it as zero
    }
}
```

- Read `Some(d) => d` as "there is a digit; call it `d` and answer with it"
- Delete the `None` arm: `E0004`, "non-exhaustive patterns: `None` not covered"

Notes:
- `None` is a shape of the type, not a null, so forgetting it is a compile error, not a crash. The `checked_` methods return the same type: `250u8.checked_add(10)` is `None`.
- `match` is an expression, so the whole `match` is the function's result. Week 3 does enums and `match` in full.
- To return one, end each path in `Some(x)` or `None`: `if secs == 0 { None } else { Some(bytes / secs) }`.
- **Q:** "Can't I just call `.unwrap()`?" It compiles, and panics on `None`: the missing case becomes a crash at run time instead of an arm you wrote.

A test dies with `attempt to add with overflow`, not a failed assertion, and only for inputs near the type's maximum. What happened?

## Summary · your first Rust

- A binding is fixed unless `let mut`; a `const` states its type
- Every integer names its width; `usize` is as wide as an address
- One hex digit is four bits; `as` keeps the low bits
- A block's value is its last expression; a stray `;` makes it `()`
- `if` and `loop` are values; ranges are half-open
- Overflow: debug panics, release wraps. Say which you mean
- `Option` is `Some` or `None`, and `match` must cover both

Notes:
- One sentence per bullet, in the order of the page. Part 0 had its own summary.
- **Q:** "How should I study this for Midterm 1?" PS1 Problem 4, then the page's For the exam section and its Problems 2 and 4.

## [Before Friday](../prep/01-cs326-2026-08-28-prep-control-flow/): check yourself

`01r`: small `usize` functions that choose, repeat, and do arithmetic at the edge of a number, under `cargo test`. Prep: about 25 minutes.

**1.** `fn cap(x: u32) -> u32 { if x > 9 { 9 } else { x }; }` — what does the compiler say, and why?

**2.** The allocator's loop tests `p + PGSIZE <= stop`, not `p < stop`. What changes when `stop` is not page-aligned?

**3.** `let m = usize::MAX; m + 1` — what happens under `oslings run`, and under `--release`? What would you write instead?

Notes:
- Walk the prep page (about 25 minutes). What you build: small `usize` functions on your laptop, the page allocator's arithmetic with the pointers removed. The three questions are the prep's own Check yourself; answers are on the prep page.
- Question 3 as printed does not compile on current `rustc`: with `usize::MAX` in view, it reports "this arithmetic operation will overflow" before anything runs. Ask it of a value that arrives at run time: debug panics, and release gives 0.
- **Q:** "Does `01r` run in QEMU?" No: `cargo test` on your laptop, like all of Module 1 except `20a`.

        async function renderMermaidDiagrams() {
            if (document.fonts && document.fonts.ready) {
                try { await document.fonts.ready; } catch (e) {}
            }
            var nodes = document.querySelectorAll('.mermaid');
            for (var i = 0; i < nodes.length; i++) {
                var el = nodes[i];
                if (el.getAttribute('data-mmd-done')) { continue; }
                try {
                    var out = await mermaid.render('mmd-' + (window.__mmdId = (window.__mmdId || 0) + 1), el.textContent);
                    el.innerHTML = out.svg;
                    el.setAttribute('data-mmd-done', '1');
                } catch (e) { if (window.console) { console.error('mermaid render failed', e); } }
            }
        }

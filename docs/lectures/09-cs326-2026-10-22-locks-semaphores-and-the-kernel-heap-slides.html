# Locks, Semaphores, and the Kernel Heap

## CS 326 Operating Systems

L15 · October 22, 2026 · exercises `37k_spinlocks` and `38k_semaphores` (Oct 29)

---

## Learning Objectives

- **Construct** a race condition and exhibit the interleaving that breaks it
- **Distinguish** test-and-set from compare-and-swap, and the RISC-V instruction each becomes
- **Justify** `Acquire` on lock and `Release` on unlock
- **Explain** how an RAII guard plus `UnsafeCell` makes locking compiler-enforced
- **Derive** the single-hart deadlock between a lock holder and an interrupt handler
- **Compute** what `Box`, `Vec`, and `Arc` cost on a page-per-allocation heap

---

## One Writer Becomes Two

Every structure so far has had exactly one writer:

- the free list (`FREELIST` in `kalloc.rs`)
- the process table
- the scheduler cursor

That assumption ends here.

- Interrupts already fire (`intr_on()` in `trap.rs`)
- Real hardware has more than one hart
- Two flows of control can now be **inside the same structure at the same instant**

---

## The Flag That Does Not Work

```rust
static mut BUSY: bool = false;

if !BUSY {          // is anyone inside?
    BUSY = true;    // no — claim it
    critical();
    BUSY = false;
}
```

<div class="highlight-box">
Three separate memory events: a <strong>load</strong>, a <strong>branch</strong>, and a <strong>store</strong>. Nothing keeps them together.
</div>

---

## The Interleaving

```text
   time   A                        B                        BUSY
   ----   -------------------      -------------------      -----
     1    lbu  t0 <- 0 (free)                                false
     2    bnez t0, not taken                                 false
     3                             lbu  t0 <- 0 (free)       false
     4                             bnez t0, not taken        false
     5    sb   1 -> BUSY                                     true
     6                             sb   1 -> BUSY            true
     7    critical()               critical()                true
                           both inside; BUSY says one is
```

The window is **two instructions** — a couple of nanoseconds.

---

## Three Words, Precisely

- **Critical section** — code that must not run in two flows at once
- **Mutual exclusion** — the property that it doesn't
- **Race condition** — what you have when you needed mutual exclusion and did not get it

<div class="info-box">
A race is a property of the <strong>program</strong>, not the run. The run that produced the right answer had the race too.
</div>

Same shape on data: `COUNTER += 1` is `ld` / `addi` / `sd` — the **lost update**.

---

## Why More Code Cannot Fix It

- **Dekker (1962)** and **Peterson (1981)** do achieve mutual exclusion from plain loads and stores
- …and need explicit fences on any CPU designed after ~1990

The structural objection:

- Every software solution is a sequence of independent operations an adversary may interleave
- Each added instruction is a **new window**
- The window closes only with an operation that has **no interior**

That is an **atomic** operation — the one thing you cannot build yourself.

---

## The RISC-V A Extension

`riscv64gc` — the `g` is IMAFD — includes atomics.

**AMOs** read, combine, write back, return the *old* value in `rd`:

```text
amoswap.w rd, rs2, (rs1)   rd = M[rs1];  M[rs1] = rs2
amoadd / amoor / amoand / amoxor / amomax / amomin
```

- Widths `.w` and `.d` only — **no byte-width AMOs**

**LR/SC**: `lr.d` places a *reservation*; `sc.d` stores only if it is intact.
Another hart's write, a context switch, a cache eviction all break it.

---

## Test-and-Set

Write `true` unconditionally; report what was there before.

```rust
while flag.swap(true, Ordering::Acquire) {
    core::hint::spin_loop();
}
```

- Old value `false` → the lock was free and is now yours
- One instruction, no failure path; the only state it expresses is **"busy"**

**Spinning is not free.** Every iteration is a *write*, and a write takes the
cache line **exclusive** — eight spinners ping-pong one line doing no work. The
standard fix, **test-and-test-and-set**, spins on a plain load until the lock
reads free and only then tries the atomic. rv6 has one hart and skips it.

---

## Compare-and-Swap

Conditional: change `x` to `new` **only if** it is currently `old`.

```rust
self.locked
    .compare_exchange(false, true, Ordering::Acquire, Ordering::Relaxed)
```

`SpinLock::lock()` (`spinlock.rs`) — `Ok(_)` you made the transition, `Err(actual)` you did not.

<div class="info-box">
<strong>ABA:</strong> CAS compares <em>values</em>, so a word that went A → B → A looks untouched. LR/SC watches the <em>address</em>, so it is immune.
</div>

---

## What rv6 Actually Compiles To

```asm
lock:   andi    a1, a0, -4        # round &AtomicBool down to a word
        slli    a0, a0, 3         # byte offset within it, times 8
        li      a2, 1
        sllw    a2, a2, a0        # shift the 1 into that byte's lane
        amoor.w.aq a3, a2, (a1)   # the atomic
        beqz    a3, .LBB0_2       # old byte 0 -> we got the lock
.LBB0_1:
        pause                     # core::hint::spin_loop()
        amoor.w.aq a3, a2, (a1)
        bnez    a3, .LBB0_1
```

- The mask-and-shift **is** the missing byte-width AMO
- **No `lr`/`sc` at all** — CAS `false → true` on a `bool` *is* test-and-set
- On `AtomicUsize` it cannot be reduced: `lr.d.aq` / `bne` / `sc.d` / `bnez`

---

## Memory Ordering: RVWMO

An atomic makes **one** operation indivisible. It says nothing about the ones around it.

- RISC-V uses **weak memory ordering**: stores may become visible out of issue order
- On *any* machine, the **compiler** will sink a store past another or hoist a load

<div class="highlight-box">
Ordering matters in rv6 even with one CPU — the reordering an interrupt handler observes is usually the compiler's.
</div>

---

## Acquire and Release

- **`Acquire`** (load / RMW) — nothing after it may move before it, so every access to the protected data stays *inside* the lock
- **`Release`** (store) — nothing before it may move after it, so every write lands *before* the unlock
- **`Relaxed`** — atomic with respect to itself, nothing more

They are useless alone. They work as a **pair**.

`spinlock.rs` compiles to `fence rw, w` then `sb zero, 0(a0)`. Two details:
the **failure ordering is `Relaxed`** (a failed CAS acquired nothing, and a
contended lock fails on most iterations), and **`is_locked` is `Relaxed` too** —
its answer is stale the instant you have it.

---

## The Pair

<div class="mermaid">
sequenceDiagram
    participant A as Holder A
    participant M as Memory
    participant B as Acquirer B
    A->>M: data = 42 (plain store)
    A->>M: locked = false (store, Release)
    Note over A,M: Release: earlier writes<br/>cannot sink below this
    B->>M: CAS locked false to true (Acquire)
    Note over M,B: Acquire: later reads<br/>cannot hoist above this
    B->>M: read data, sees 42
</div>

---

## The Interior-Mutability Puzzle

`lock(&self)` takes a *shared* reference and must hand back something you can write through.

```rust
pub struct SpinLock<T> {
    locked: AtomicBool,
    data: UnsafeCell<T>,     // spinlock.rs
}
```

- `&T` normally means **nobody may mutate**
- `UnsafeCell<T>` is the one type the compiler treats as opting out
- It checks nothing — it grants **permission**; the lock supplies the correctness

---

## `Drop` Is the Unlock

```rust
pub struct SpinLockGuard<'a, T> { lock: &'a SpinLock<T> }

impl<T> Drop for SpinLockGuard<'_, T> {
    fn drop(&mut self) { self.lock.unlock(); }     // spinlock.rs
}
```

- Cannot forget to unlock — early `return` or panic cannot skip it
- Cannot unlock twice — `Drop` runs once
- Cannot reach the data without the lock — the only path is through a guard
- `'a` stops the lock being moved or dropped while a guard lives

---

## One Character Apart

```rust
let _g = lock.lock();   // held to end of scope
let _  = lock.lock();   // held for ZERO statements
```

- `_` is a *pattern*, not a binding — the temporary drops at the end of that statement
- No warning. The code is well-formed and means what was written
- `drop(guard)` releases early on purpose — `Shell::cmd_cd()` (`shell.rs`)

---

## `Send` and `Sync`

- **`Send`** — a value may be *moved* to another thread
- **`Sync`** — a `&T` may be *shared* with another thread

`UnsafeCell` is deliberately **not** `Sync`, so `SpinLock<T>` isn't either.

```rust
unsafe impl<T: Send> Sync for SpinLock<T> {}    // spinlock.rs
```

- The `unsafe` is a **signature**: *I checked that the lock serializes access*
- `T: Send`, not `T: Sync` — the lock hands `&mut T` to whichever hart wins
- `const fn new` (`spinlock.rs`) is why `FS` (`fs.rs`) can be a plain `static`

---

## Deadlock

Four conditions, all at once (Coffman, 1971): **mutual exclusion**, **hold-and-wait**, **no preemption**, **circular wait**. Break any one.

```text
   thread A                    thread B
   FS.lock()                   PROC.lock()
   PROC.lock()   <-- waits     FS.lock()     <-- waits     forever
```

- Kernels break the fourth: a **global lock order**, acquired in increasing order
- xv6 states it in comments; Linux checks it at runtime with `lockdep`

---

## The Single-Hart Deadlock

<div class="mermaid">
flowchart TD
    A["kernel code calls FS.lock()\nCAS false to true succeeds"] --> B["UART interrupt fires\ninterrupts were never disabled"]
    B --> C["console::intr runs\non the SAME hart"]
    C --> D["handler calls FS.lock()"]
    D --> E["CAS sees true, spin_loop forever"]
    E --> F["the only code that could store false\nis the code we interrupted"]
    F --> E
</div>

---

## Two Rules Every Kernel Follows

**1. Interrupts off while holding a spinlock.**

- xv6: `acquire()` calls `push_off()` (clears `sstatus.SIE`, bumps a nesting depth); `release()` calls `pop_off()`
- Nesting matters — naive enable-on-release re-enables while the outer lock is held
- Linux: `spin_lock_irqsave`

**2. Never sleep holding a spinlock.** Waiters burn CPU; on one hart nobody can run the holder again.

rv6 does neither — one hart, lock-free interrupt handlers (`BUF` in `console.rs`).

---

## Semaphores: P and V

Dijkstra, 1965, the THE system. *proberen* / *verhogen*.

- **P / wait** — decrement if the count exceeds zero, otherwise block
- **V / post** — increment, waking a waiter

```text
count = initial + (completed V) - (completed P)      and  count >= 0
```

- 1 permit → **binary semaphore**, behaves like a mutex
- *n* permits → **counting semaphore**: buffer slots, DMA channels

A mutex has an **owner**; a semaphore does not — which is why it is good at *signaling*.

---

## rv6's Semaphore

```rust
pub struct Semaphore {
    count: SpinLock<i64>,        // semaphore.rs
}
```

- The count is shared mutable state, so it lives behind the lock you just built
- `try_wait` (`semaphore.rs`) locks, tests, decrements
- `post` (`semaphore.rs`) locks and increments
- Both take `&self` — interior mutability, laundered through the lock

`try_wait`, not `wait`: blocking needs a sleep queue and somebody else to run.

---

## The Lost Wakeup

```text
   time   consumer                     producer         count  sleeping
   ----   --------------------------   --------------   -----  --------
     1    reads count == 0, decides                       0       -
          to sleep
     2                                 count += 1         1       -
     3                                 wakeup()           1     none!
     4    sleep()                                         1    forever
```

The wakeup woke nobody, because nobody was asleep yet.
Two instructions wide; the symptom is a hang minutes later somewhere else.

---

## The Sleep/Wakeup Contract

Testing the condition and going to sleep must be **atomic with respect to the wakeup**.

1. Evaluate the condition **while holding a lock**
2. `sleep` marks the process `Sleeping`, **then** releases the lock
3. `wakeup` takes the same lock before scanning
4. On waking, re-test in a **`while`, not an `if`**

xv6's `sleep(chan, lk)`, and every condition variable in every language.
`ProcState::Sleeping` exists in `proc.rs`; nothing puts a process there yet.

---

## The Bounded Buffer

```text
   empty = N   free slots     full = 0   filled slots     mutex = 1

   producer                          consumer
     P(empty)   // claim a slot        P(full)    // claim an item
     P(mutex)                          P(mutex)
     buf[in] = item; in = (in+1)%N     item = buf[out]; out = (out+1)%N
     V(mutex)                          V(mutex)
     V(full)    // publish it          V(empty)   // release the slot

   invariant:  empty + full + (items in flight) = N
```

Swap `P(mutex)` and `P(empty)` and you block **holding the mutex** — deadlock.

---

## The Kernel Heap Comes Online

```rust
unsafe impl GlobalAlloc for KernelHeap {
    unsafe fn alloc(&self, layout: Layout) -> *mut u8 {         // kheap.rs
        if layout.size() > PGSIZE || layout.align() > PGSIZE {  // kheap.rs
            return ptr::null_mut();
        }
        kalloc::kalloc()
    }
    unsafe fn dealloc(&self, ptr: *mut u8, _l: Layout) { kalloc::kfree(ptr) }
}

#[global_allocator]                                             // kheap.rs
static ALLOCATOR: KernelHeap = KernelHeap;
```

A **language item**: one per binary, and every allocation in the program routes through it.

---

## What It Costs

| Expression | Bytes wanted | Pages | Wasted |
|---|---|---|---|
| `Box::new(7u64)` | 8 | 1 | 4088 |
| `Arc::new(Semaphore::new(2))` | 32 | 1 | 4064 |
| `Vec::<u32>::with_capacity(2048)` | 8192 | — | fails, then panics |

- `Arc::clone` bumps the strong count **atomically** — your spinlock's primitive
- `Arc<T>` yields only `&T`, so shared mutation needs interior mutability inside
- `Arc<Semaphore>` = `Arc<Mutex<T>>`, the standard Rust shape

---

## Why So Late, Why So Small

**Late** — the heap allocates from `kalloc`, whose free list is only populated by `kalloc::init()` (`main.rs`). Nothing may allocate before that.

**Small** — Linux uses a buddy allocator plus SLUB; xv6 has no kernel `malloc` at all. rv6's forty lines serve a `Vec<(String, usize)>` and a few `Arc`s.

<div class="highlight-box">
And it is <strong>not thread-safe</strong>: <code>kalloc</code> walks a bare <code>static mut FREELIST</code> (<code>FREELIST (kalloc.rs)</code>) with no lock. Fixing it means wrapping the free list in the <code>SpinLock</code> you are about to write.
</div>

---

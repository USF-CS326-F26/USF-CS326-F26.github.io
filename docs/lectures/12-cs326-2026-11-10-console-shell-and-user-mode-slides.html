<!-- .slide: id="thu-45k" -->

## Thursday · `45k`: interrupts, not polling

Until now, reading the UART meant **polling**: check its status bit, and if no byte waits, check again. With **interrupts**, the UART announces each byte.

- Output stays polled: a byte leaves in microseconds
- The **PLIC** routes device lines to harts; the UART is its **source** 10
- It arrives by week 11's trap path: `scause` `0x8000_0000_0000_0009`

Notes:
- Read the `scause` top bit first: set means an interrupt, and cause 9 is a supervisor external interrupt. It sits beside `44k`'s forwarded tick, cause 1, in the same trap path.
- A typist sends about ten bytes a second, and polling spends the gaps asking. Output stays polled for a second reason: a panic can strike with interrupts off, and it must still print. ↓ below: polling by the numbers (optional).
- **Q:** "Why a PLIC at all? Why not wire the UART to the CPU?" A board has dozens of devices and a few harts. The PLIC decides which hart hears which device, and at what priority. Its four registers are an exam slide shortly.

--

<!-- .slide: id="deeper-polling" class="deeper" -->

## Polling by the numbers

A typist at 90 words a minute sends a byte every 130 ms. A loop whose status read takes 100 ns asks 1.3 million times per byte; an interrupt costs about a microsecond.

Output turns this around: at 115,200 baud a byte leaves in 87 µs, and with a 16-byte FIFO the first status read nearly always succeeds.

A 10 Gbit/s card can receive a frame every 67 ns, faster than one interrupt, so Linux's NAPI takes one interrupt, then polls until the ring drains.

---

<!-- .slide: id="45k-claim" -->

## Claim, service, complete

<div class="mermaid">
stateDiagram-v2
    [*] --> Idle
    Idle --> Pending: the UART raises its line
    Pending --> Claimed: the handler reads the claim register
    Claimed --> Idle: the handler writes the source number back
</div>

- **Claim**: ask the PLIC which source fired; 0 means none
- **Service**: make the device stop asking
- **Complete**: write the source number back, so the PLIC may deliver it again

A `Claimed` source delivers nothing more.

Notes:
- Claim can return 0: a handler can run with nothing pending, so 0 means "nothing to service, nothing to complete".
- Skip the completion, and the first key works while every later one vanishes, silently. Nothing panics: the PLIC simply never delivers source 10 again. Thursday's prep question 1 is this.
- ↓ below: every gate between a key and your handler (optional), the checklist for "nothing happens when I type".
- **Q:** "Why claim, if only the UART is enabled?" The handler cannot assume that: on a real board several sources share the one external interrupt. A claim also marks the source in progress, so no other hart takes it meanwhile.

--

<!-- .slide: id="deeper-gates" class="deeper" -->

## Every gate between a key and your handler

A key reaches the handler only through nine open gates, all given this week:

```text
1  UART          IER bit 0: interrupt when a byte arrives
2  PLIC          source 10's priority above 0
3  PLIC          source 10 enabled for context 1
4  PLIC          context 1's threshold below that priority
5  mideleg       bit 9, set in M-mode: external interrupts go to S-mode
6  sie           SEIE, bit 9: this hart takes external interrupts
7  sstatus       SIE: the global switch
8  stvec         aimed at the kernel's trap vector
9  page table    the PLIC's registers mapped, with the MMU on
```

Eight fail silently; an unmapped PLIC faults instead. If ticks count while keys do nothing, 7 and 8 are open: suspect the console's setup, which opens 1–4 and 6.

<!-- .slide: id="45k-one-thing" -->

## The one thing to get right · `45k`

The first key freezes the machine. Why?

`[fail] the interrupt handler did not buffer the byte`

The UART's line is **level-triggered**: it reports a state, "unread data", not an event. Complete while that state holds, and the PLIC delivers it again at once: an **interrupt storm**.

<div class="highlight-box">Complete tells the PLIC you are done; only service makes the device stop asking.</div>

Notes:
- Two ways a console dies: skip the completion and it goes silent after one key; skip the service and it storms. Thursday's prep asks both, questions 1 and 2.
- A storm pins the CPU inside the trap path: nothing else ever runs, so it looks like a hang, not a crash.
- **Q:** "How do I tell a storm from a hang?" Stop QEMU in GDB a few times. A storm is always somewhere in the trap path with `scause` 9; a hang sits in one place.

---

<!-- .slide: id="45k-ring" -->

## A ring between two worlds

The handler, with interrupts off, only stores bytes in a **ring**: an array and two counters that only grow, taken modulo its length. rv6 has 256 slots; here, four:

```text
                          slots 0 1 2 3   HEAD  TAIL
start                           . . . .    0     0
handler pushes e, c             e c . .    0     2
reader takes e                  e c . .    1     2
handler pushes h, o, !          ! c h o    1     5    slot 4 % 4 = 0
handler pushes ?                ! c h o    1     5    4 waiting: full, dropped
reader takes c, h, o, !         ! c h o    5     5    HEAD == TAIL: empty
```

Read `TAIL - HEAD` as "bytes waiting". No lock: each side writes only its own counter.

Notes:
- The handler, the only **producer**, stores a byte and then advances `TAIL`; the reader, the only **consumer**, takes one and then advances `HEAD`. A stale read errs safely: the reader waits, or a byte is dropped. A full ring drops the newest byte, because a handler cannot wait.
- A lock that leaves interrupts on, as rv6's does, would hang the kernel: the handler interrupts the reader that holds it, then spins forever. A reader with nothing to read runs `wfi`, halting until the next interrupt.
- The xv6 book calls the reader the **top half** and the handler the **bottom half**. Linux uses the words for a different split: its top half is the handler, its bottom half the work the handler defers. The split is what matters.
- **Q:** "Why not wrap the counters at 4?" Then `HEAD == TAIL` would mean both empty and full. Counters that only grow make `TAIL - HEAD` the count, which tells the two apart.

---

<!-- .slide: id="exam-plic" class="exam" -->

## The PLIC's four registers

Priority belongs to a source; enable, threshold and claim belong to a **context**, one hart in one mode. rv6 uses context 1: hart 0 in S-mode. `PLIC` is `0x0c00_0000`:

```text
priority, source 10    PLIC + 4 × 10      0x0c00_0028   1; 0 means never
S-mode enable bits     PLIC + 0x2080      0x0c00_2080   bit 10: 0x400
S-mode threshold       PLIC + 0x20_1000   0x0c20_1000   0: accept 1 and up
claim / complete       PLIC + 0x20_1004   0x0c20_1004   read: claim; write: done
```

A source is delivered only if enabled and its priority is strictly above the threshold.

Notes:
- Midterm 2. Practice Set 2 Problem 11 (b) orders these steps for one keystroke and asks for each address; its "what if complete is skipped" is the silence from 45k-claim.
- Setup writes the first three once, at boot. A handler touches only the fourth, twice: a read claims, and writing the same number back completes.
- ↓ Problem 1: the same registers for a second hart.
- **Q:** "Why is threshold 0 enough?" Delivery needs a priority strictly above the threshold, so threshold 0 accepts every priority from 1 up, and a priority of 0 never fires.

--

<!-- .slide: id="problem-1" class="deeper" -->

## Problem 1: the PLIC for a second hart

On QEMU's `virt`, hart *i* owns PLIC context 2*i* in M-mode and 2*i* + 1 in S-mode. Context *c*'s enable words start at `PLIC + 0x2000 + 0x80 × c`, 32 sources a word; its threshold is at `PLIC + 0x20_0000 + 0x1000 × c`, with claim/complete 4 bytes above. `PLIC` is `0x0c00_0000`.

- **(a)** Give hart 1's S-mode enable, threshold and claim/complete addresses.
- **(b)** Which word and bit enable source 35 there, and where is its priority?
- **(c)** Hart 1's threshold is 1 and source 35's priority is 1. Is it delivered?
- **(d)** Does rv6's 4 MiB PLIC mapping cover all of these?

--

<!-- .slide: id="problem-1-solution" class="deeper" -->

## Problem 1 · solution

**(a)** Hart 1 in S-mode is context 2 × 1 + 1 = 3:

```text
enable      0x0c00_2000 + 0x80 × 3     = 0x0c00_2180
threshold   0x0c20_0000 + 0x1000 × 3   = 0x0c20_3000
claim       0x0c20_3000 + 4            = 0x0c20_3004
```

Context 1 gives rv6's own `0x0c00_2080`, `0x0c20_1000` and `0x0c20_1004`.

**(b)** Word 35 / 32 = 1, at `0x0c00_2184`; bit 35 % 32 = 3, value `0x8`. Priority belongs to the source: `0x0c00_0000 + 4 × 35` = `0x0c00_008C`.

**(c)** No: delivery needs a priority strictly above the threshold. **(d)** Yes, it runs to `0x0c3F_FFFF`; only rv6's context-1 constants change.

<!-- .slide: id="thu-46k" -->

## Thursday · `46k`: a loop, and words

A shell is a **REPL**: read a line, evaluate it, print, loop. The given read loop draws the prompt, each key and each erase, and passes on the whole line at Enter: it is the **line discipline** too.

Evaluating starts by cutting the line into words, without copying:

```rust
let mut line = String::from("tune  440");
let last = line.split_whitespace().last().unwrap();       // "440"
let at = last.as_ptr() as usize - line.as_ptr() as usize; // 6
```

Read `at` as "the word starts 6 bytes into the line".

Notes:
- The console returns raw bytes, so every character you see while typing, the shell echoed. ↓ below: who owns the backspace, and Problem 2 (optional).
- A word is a view into the line, so while one is in use, `line.clear()` draws "cannot borrow `line` as mutable because it is also borrowed as immutable". Thursday's prep question 3 is this.
- **Q:** "What does a line of only spaces give?" No words at all. Runs of spaces separate words and are never words themselves, so `mkdir   docs` means `mkdir docs`.

--

<!-- .slide: id="deeper-line-discipline" class="deeper" -->

## Who owns the backspace

Your terminal does not echo: it sends each byte and draws what comes back. Run `stty -echo` in a Unix shell, and typing shows nothing, yet commands still run.

Unix keeps the line discipline in the kernel's tty layer, whose **canonical** ("cooked") mode echoes, erases, and returns from `read` at a newline; `vi` switches to **raw** mode and does it all itself.

xv6 edits in its console interrupt handler. rv6's shell does the work, so Ctrl-C does nothing and an arrow leaves stray characters (↓ Problem 2).

--

<!-- .slide: id="problem-2" class="deeper" -->

## Problem 2: predict the screen and the line

At the `rv6$ ` prompt someone types these bytes, in hex where unprintable:

```text
c  d  SP  x  7F  d  c  1B  [  D  o  09  0D
```

`7F` is Backspace, `1B [ D` the Left arrow, `09` Tab, `0D` Enter. With the given read loop:

- **(a)** Which bytes does the shell echo?
- **(b)** What line reaches the evaluate step, and what words?
- **(c)** The typist pressed Left to slip the `o` in between `d` and `c`. Why did that fail?

--

<!-- .slide: id="problem-2-solution" class="deeper" -->

## Problem 2 · solution

**(a)** `c d SP x`, then `08 20 08` for the Backspace: back, blank, back. Then `d c`. `1B` is unprintable, so it is dropped unechoed, but `[` and `D` echo like letters; then `o`. Tab is dropped. Enter echoes `\n`. The screen shows `rv6$ cd dc[Do`.

**(b)** `"cd dc[Do"`, two words: `cd` and `dc[Do`.

**(c)** This line discipline has no cursor: it appends and erases at the end only. An arrow is a three-byte escape sequence, and a loop that knows nothing of escapes drops the `ESC` and keeps its printable followers.

---

<!-- .slide: id="46k-dispatch" -->

## One `match`, and `&mut dyn Out`

Choosing a handler by name is **dispatch**: one `match` on a `&str`. The same shape, for tempo names:

```rust
fn bpm(word: &str) -> Option<u32> {
    match word {
        "largo" => Some(50),
        "presto" => Some(180),
        _ => None,
    }
}
```

The four given handlers (`pwd`, `ls`, `cd`, `mkdir`) print through `&mut dyn Out`, `07r`'s trait object: the console under `cargo run`, a buffer under test.

Notes:
- Read `_` as "any other word". Without it, rustc refuses: "non-exhaustive patterns: `&_` not covered". A `match` on strings must say what every other word means.
- The current directory is a heap `Vec` of (name, inode number) pairs: `38k`'s allocator is what lets the path grow as you `cd` deeper. ↓ below: built-in or program (optional).
- **Q:** "Why a trait object and not a generic?" Either works. With `dyn`, each handler is compiled once and the test hands in a different sink at run time. The cost is one indirect call per write: nothing, next to a UART byte.

--

<!-- .slide: id="deeper-builtins" class="deeper" -->

## Built-in or program

A Unix shell runs most commands as programs: it forks, the child `exec`s the program, and the parent waits. rv6's kernel shell can do neither, so every command is a **built-in**.

On Unix some must be: a child gets a *copy* of the current directory, so a `cd` program would change only its own. A command that changes the shell's own process state, like `cd` or `exit`, is a built-in.

xv6's `sh.c` handles `cd` before it forks: "Chdir must be called by the parent, not the child."

---

<!-- .slide: id="46k-one-thing" -->

## The one thing to get right · `46k`

Every test passes. Then you press Enter at an empty prompt, and QEMU exits. Why?

`OSLINGS:FAIL (panic)`

A blank line has no first word, and a `None` unwrapped is a panic. In a kernel, a panic stops the whole machine: the shell, the console, everything.

<div class="highlight-box">Every word the user types is optional, the first one included.</div>

Notes:
- The tests never send a blank line, so this hides until you use the shell for real. Before you submit, try Enter alone, spaces then Enter, and a word that is no command.
- The kernel's one panic handler prints that line and powers QEMU off through the test device, in either build. In `52k`, when the shell is a user program, the same mistake kills one program instead.
- **Q:** "Why not just catch the panic?" A `no_std` kernel has no unwinding: a panic handler never returns. The only cure is not to panic.

<!-- .slide: id="ec-47k" -->

## Extra credit · `47k_file_commands`

`touch`, `cat` and `rm`; `echo TEXT > FILE` and `rmdir` come finished, as models to read.

- The `40k` filesystem reports facts: "no such name", "already exists"
- Each command decides which facts are errors
- Unix `rm` calls a missing name an error; `rm -f` calls the same fact success

Notes:
- Released Thursday, worth +0.5. Two minutes here: this slide is the whole of it in lecture, and the page has the box.
- The filesystem said the same thing both times; only the command's policy differs. ↓ below: why the call is `unlink` (optional).
- **Q:** "Why is there no `delete` call?" A name and a file are different things: a directory holds the name, an inode holds the file. ↓ deeper-unlink.

--

<!-- .slide: id="deeper-unlink" class="deeper" -->

## Why the call is `unlink`

*For `47k`.* A name lives in a directory and the file in its inode, so removing a name is not destroying a file.

POSIX has no `delete`: `unlink` removes one entry, and the file goes only when no name and no open reference is left.

What rv6 risks by keeping no link count is Midterm 2 material: [Week 11's For the exam](11-cs326-2026-11-03-filesystems-boot-order-and-traps/#exam-links).

<!-- .slide: id="fri-48k" -->

## Friday · `48k`: why a wall

| Mechanism | Restricts | Met in |
|---|---|---|
| Privilege levels | which instructions run | `43k` |
| Page tables | which addresses exist | `33k`, `39k` |

Neither alone suffices: without paging, a plain `ld` reads the kernel; without privilege, a program writes `satp`.

- In **user mode** (U), a supervisor CSR or `sret` is illegal (`scause` 2); rv6 then ends the program
- Down: clear `sstatus.SPP`, then `sret`. Up: only a trap

Notes:
- From `49k` on, rv6 runs code it did not write and cannot trust. The wall turns a bad program into one dead process, not a dead machine.
- Nothing climbs back except a trap, through the `stvec` the kernel set: an `ecall`, an interrupt, or a fault. For an `ecall` the program chooses when; for every trap the kernel chooses where, because `stvec` is a supervisor CSR. The drop is `43k`'s trick one level lower, with `SPP` = 0.
- **Q:** "Can a program find out it is in user mode?" Not by asking: reading any supervisor CSR is itself illegal. It can only notice what it may not do.

---

<!-- .slide: id="48k-address-space" -->

## A private address space

A process's own table goes into `satp` for the first time on Friday. Everything it maps:

```text
page at         holds                           PTE_U  reached by
0x0000_0000     the program's code              set    the program
0x0000_1000     its stack; sp starts at 0x2000  set    the program
     ...        nothing mapped
0x3F_FFFF_E000  the trapframe                   clear  the kernel, mid-trap
0x3F_FFFF_F000  the trampoline                  clear  the kernel, both ways
```

`PTE_U` is the wall: the top pages lack it, mapped yet out of reach. W⊕X binds the program's pages too.

Notes:
- Read address 0 as just another page: the null pointer is a convention. The kernel's own memory is simply absent from this table.
- The check also runs the other way: rv6's kernel may not touch a U page, so the given `copyin` translates instead of loading (48k-program).
- **Q:** "Where does the stack go later?" `49k` moves it higher, to `0x1_0000`, to make room for bigger programs. Practice Set 2 Problem 13 draws that later layout; the idea is the same.

---

<!-- .slide: id="48k-trapframe" -->

## The trapframe, and why not the user's stack

An `ecall` changes the mode and the pc, but no general register. The kernel cannot push the program's registers: `sp` is the program's choice. Instead each process gets a **trapframe**, a slot for every register:

```text
  0   the kernel's satp                  notes the kernel leaves
  8   this process's kernel stack top      for its way back in
 16   the Rust trap handler's address
 24   the program's pc, kept across the visit
 32   unused
 40   then the 31 registers: a0 at 112, a7 at 168
```

`#[repr(C)]` fixes the offsets the assembly uses.

Notes:
- The three notes are written on every trip out to U and read by `uservec` on the trip back in; slot 24 takes `sepc` at the trap and goes back into `sepc` before `sret`. Practice Set 2 Problem 13 (c) asks for exactly these fields and who writes each.
- A `35k` context needs 14 registers, since a call fills it at a moment the code chose. A trap lands anywhere, so this keeps all 31.
- **Q:** "Why a kernel stack per process, not one for the whole kernel?" From `51k`, many processes are paused inside the kernel at once, each mid-call. Each one's unfinished kernel work waits on its own stack until it runs again.

---

<!-- .slide: id="48k-trampoline" -->

## The trampoline

Entering the kernel means putting the kernel's table in `satp`. The pc does not change when `satp` does, so the next fetch goes through the table just installed. The fix: both tables map the switching code at one virtual address:

<div class="mermaid">
flowchart LR
    K["kernel table"] --> T["one physical page: uservec, userret"]
    A["process 1's table"] --> T
    B["process 2's table"] --> T
</div>

Whichever table is live, the next fetch finds the same bytes.

Notes:
- Both halves are given. `stvec` points at `uservec` while user code runs; `uservec` runs on every way in, `userret` on every way out, the first exit included.
- The page lacks U, so user code gets there only by a trap, and a trap raises the privilege level first. Friday's prep question 3 asks why. ↓ below: the trampoline, rediscovered (optional).
- **Q:** "Why not turn paging off for the switch instead?" A `satp` of mode 0 makes the next fetch physical, and `0x3F_FFFF_F…` is no RAM at all: the same problem, worse.

--

<!-- .slide: id="deeper-kpti" class="deeper" -->

## The trampoline, rediscovered

For decades Linux mapped itself, supervisor-only, into every address space, so a system call changed privilege but not tables.

In 2018 Meltdown showed that speculation could read such pages just because they were mapped.

The fix, **KPTI**, unmaps the kernel from user tables and switches `CR3`, x86's `satp`, on every entry, from code mapped in both. Linux 4.15 called it the entry trampoline.

---

<!-- .slide: id="exam-top-pages" class="exam" -->

## Two pages at the top

| Page | Address | Flags | Mapped in |
|---|---|---|---|
| `TRAMPOLINE` | `0x3F_FFFF_F000` | R X | the kernel's table and every user table: one physical page |
| `TRAPFRAME` | `0x3F_FFFF_E000` | R W | user tables only: a different page per process |

Neither carries U. The fetch that fails without the trampoline is the one right after the `satp` write.

Notes:
- Midterm 2. Practice Set 2 Problem 13 (b) asks for "the exact instruction that would fail": the instruction after the `satp` write, whose fetch goes through the new table, in either direction.
- The kernel's table has no trapframe entry: the kernel reaches each trapframe at its physical address. ↓ Problem 3: both addresses and the trampoline's PTE, by hand.
- **Q:** "Why R X for one and R W for the other?" The trampoline is code and the trapframe is data: W⊕X holds up here too.

--

<!-- .slide: id="problem-3" class="deeper" -->

## Problem 3: the two top pages

`TRAMPOLINE` is `MAXVA - PGSIZE`, with `MAXVA` = `1 << 38`; `TRAPFRAME` is one page below.

- **(a)** Give both addresses and their VPN[2], VPN[1], VPN[0].
- **(b)** Encode the trampoline's leaf PTE, R X V, for physical page `0x87FF_D000`.
- **(c)** How many level-0 tables of one user table hold both entries, and how does the kernel's table differ?
- **(d)** Why may neither leaf carry U?

--

<!-- .slide: id="problem-3-solution" class="deeper" -->

## Problem 3 · solution

**(a)** `MAXVA >> 30` is 256, so the page just below has VPN[2] 255, and each lower index is all ones, 511:

```text
TRAMPOLINE   0x40_0000_0000 - 0x1000 = 0x3F_FFFF_F000    VPN 255, 511, 511
TRAPFRAME    one page lower          = 0x3F_FFFF_E000    VPN 255, 511, 510
```

**(b)** R + X + V = 2 + 8 + 1 = `0xB`: `pa >> 12` is `0x8_7FFD`, `<< 10` is `0x21FF_F400`, `| 0xB` is `0x21FF_F40B`.

**(c)** One: equal VPN[2] and VPN[1] lead to one level-0 table, entries 511 and 510 side by side. The kernel's table has the same entry 511 and no 510.

**(d)** With U on the trapframe, a program could rewrite the kernel's notes, and its next trap would run S-mode code of its choosing. U would also break the kernel's own path: S-mode never executes a U page, and with `sstatus.SUM` clear it cannot load or store one, so `uservec` would fault at once.

---

<!-- .slide: id="exam-sscratch" class="exam" -->

## `sscratch`: the first free register

At a trap from U, `uservec` needs a register for the trapframe's address, and all 31 hold user values. So while user code runs, `sscratch` holds `TRAPFRAME`, and `uservec` opens with one swap:

```asm
csrrw a0, sscratch, a0    # a0 = TRAPFRAME; the user's a0 waits in sscratch
```

`userret` ends with the same swap before `sret`: the user's `a0` returns, and `sscratch` is re-armed.

Notes:
- Midterm 2. `csrrw` writes the CSR and returns its old value in one instruction, so neither value is lost at any moment.
- Every trip to U re-arms it, the first included, because the first trip goes through `userret` too. Week 11 named `sscratch`; this is what it is for.
- **Q:** "Why not keep the address in a register the program never uses?" The program may use every register, and the kernel promised to return every register it did not answer in. A CSR is the one place U cannot touch.

---

<!-- .slide: id="48k-abi" -->

## The system-call ABI

Printing means storing to UART registers, and no user table maps them, so a program asks with a **system call**:

| Register | Before `ecall` | After |
|---|---|---|
| `a7` | the call's number | unchanged |
| `a0`, `a1`, `a2` | the arguments | `a0` holds the result |

`ecall` traps with `scause` 8. rv6 uses xv6's numbers: `exit` 2, `getpid` 11, `write` 16.

Notes:
- The number comes from code the kernel does not trust: no number may crash the kernel, and "no such call" answers -1.
- Between the trap and the `sret`, the program's registers live only in its trapframe: `uservec` parked every one there, and `userret` reloads every one from there.
- **Q:** "Why `a7` for the number, and not `a0`?" So the arguments sit where an ordinary call puts them, from `a0` up, and a wrapper function can pass them straight through. The number takes the last argument register.

---

<!-- .slide: id="48k-retry" -->

## Done versus retry

`sepc` holds the pc of the trapping instruction, and `sret` returns there:

| Trap | Resume at that instruction? |
|---|---|
| page fault | yes, if the kernel can map the page (rv6 ends the program) |
| interrupt | yes: that instruction never ran |
| `ecall` | no: the call is done; resuming repeats it forever |

So the kernel steps past a finished `ecall`: 4 bytes, as `ecall` has no compressed form.

Notes:
- The principle: step past a trap that did its work; resume at one that reported a condition. Friday's prep question 2 is this.
- The kernel knows the trapping instruction was an `ecall`, and every `ecall` is 4 bytes. ↓ Problem 4: where a program resumes after four different traps.
- **Q:** "Doesn't `sret` step past it by itself?" No: `sret` jumps to exactly `sepc`. The hardware cannot know whether the kernel finished the work or fixed a condition, so software decides.

--

<!-- .slide: id="problem-4" class="deeper" -->

## Problem 4: where does the program resume?

A program of your own:

```text
0x40:  li    a7, 11        2 bytes, compressed
0x42:  ecall               4 bytes
0x46:  ld    t0, 0(a0)     4 bytes
0x4a:  csrr  t1, sstatus   4 bytes
```

Give `scause`, `sepc` and the resume address when:

- **(a)** the `ecall` completes a `getpid`
- **(b)** the `ld` touches an unmapped page, which a demand-paging kernel then maps
- **(c)** rv6's timer tick arrives just before the `ld`
- **(d)** the `csrr` runs
- **(e)** A kernel adds 4 to the saved pc after every trap. What changes?

--

<!-- .slide: id="problem-4-solution" class="deeper" -->

## Problem 4 · solution

| | `scause` | `sepc` | Resumes at |
|---|---|---|---|
| (a) | `8`, ecall from U-mode | `0x42` | `0x46`: the call is done |
| (b) | `13`, load page fault | `0x46` | `0x46`: the load runs again |
| (c) | `0x8000_0000_0000_0001`, the forwarded tick | `0x46` | `0x46`: the `ld` never ran |
| (d) | `2`, illegal instruction | `0x4a` | nowhere: rv6 ends the program |

**(e)** (a) and (d) stay the same. (b) skips the load, so `t0` is stale and the program runs on with wrong data. (c) is worse: an unrelated interrupt deletes one of its instructions at a random moment.

## The one thing to get right · `48k`

`hello from user mode` appears once. Then nothing: why?

`[fail] the program ran, but its system calls were never answered`

Each return landed on the same `ecall`, so the finished `write` ran again, and again, until the watchdog gave up. The repeats print nothing: `a0` now holds 21, not fd 1.

<div class="highlight-box">A call that is done must not be made again.</div>

Notes:
- The test's watchdog gives up after a few seconds. Under `cargo run` there is no watchdog: the one line appears, and the `rv6$` prompt never comes back.
- It is the page fault's opposite, where staying put is the point: the same `sepc`, two right answers.
- **Q:** "Why does the program never reach `getpid`?" The instruction after the `ecall` never runs. Each return lands on the `ecall` again, with `a7` still 16.

<!-- .slide: id="48k-program" -->

## The first program, and a user pointer

`49k` brings the loader. Until then the first program is a dozen hand-written instructions, copied onto the code page:

```text
call     a7   arguments                    comes back
write    16   1, the message at 0x24, 21   21, the bytes written
getpid   11   none                         1, the first pid
exit      2   the pid plus 41              never
```

`0x24` means something only in the program's table. The given `copyin` translates it by hand with `walkaddr`, and a page without U counts as no page.

Notes:
- The kernel never dereferences a user pointer. It translates, page by page, because a buffer can straddle two pages that sit anywhere in RAM.
- Pass the trapframe's address as the buffer, and you get -1: nothing leaks. Friday's prep question 1 is this. ↓ below: why `copyin` refuses what the kernel could reach (optional).
- **Q:** "What if the buffer starts in a good page and runs off its end?" The copy goes page by page, so the next page must be a U page too, or the call returns -1, though some bytes from the good page may already have printed.

--

<!-- .slide: id="deeper-deputy" class="deeper" -->

## Why `copyin` refuses what the kernel could reach

Pass `TRAPFRAME` as `write`'s buffer, and a naive translation succeeds, since the page is mapped in the user's table: the copy leaks the kernel's notes.

A privileged program tricked into using its authority for a caller who lacks it is a **confused deputy** (Norm Hardy, 1988), and `walkaddr`'s U check is the cure.

Hardware adds a second lock: while `sstatus.SUM` (bit 18) is clear, as rv6 leaves it, supervisor accesses to U pages fault. x86 calls this SMAP; ARM calls it PAN.

---

<!-- .slide: id="48k-round-trip" -->

## One `getpid`, end to end

At the first program's real addresses:

<div class="mermaid">
sequenceDiagram
    participant P as program
    participant H as hardware
    participant T as trampoline
    participant R as Rust handler
    P->>H: ecall at 0x14, 11 in a7
    H->>T: S-mode, scause 8, sepc 0x14, pc from stvec
    T->>R: 31 registers parked, kernel table live
    R->>T: the answer is 1, resume at 0x18
    T->>P: user table live, registers reloaded, sret
    Note over P: at 0x18, addi a0, a0, 41 makes a0 = 42
</div>

Status 42 is a receipt for both crossings: the kernel's 1 came in, and 1 + 41 went back out as `exit`'s argument.

Notes:
- This is Midterm 2's "trace the trap" shape. At each step, name who acts (the hardware, `uservec`, Rust, `userret`) and which CSR or structure holds the value.
- `li a7, 11` is 2 bytes, compressed, and `ecall` is 4: hence `0x14` + 4 = `0x18`. The addresses change if the program changes; the shape does not.
- **Q:** "Where is the 1 between the kernel and the program?" In RAM, in the trapframe's `a0` slot, from the moment the kernel writes it until `userret` loads it. Nothing crosses the wall in a register.

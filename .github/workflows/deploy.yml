name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # --strict fails the build on any broken internal link. With 25+
      # cross-linked lecture pages that is the only thing keeping the site
      # honest, so do not remove it.
      - name: Build site
        run: mkdocs build --strict

      # --strict validates markdown links between pages, but the schedule's
      # links are rendered as raw HTML by a Jinja loop, so it never sees them.
      # A renamed lecture would silently 404 from the site's home page.
      - name: Check schedule links
        run: |
          pip install pyyaml
          python3 utils/check_links.py

      # Lecture material cites rv6 by file and item, never by line number, so a
      # renamed function silently orphans every citation of it. No-ops until the
      # OSlings sources are checked out beside the site (OSLINGS_ROOT).
      - name: Check code citations
        run: python3 utils/check_refs.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
